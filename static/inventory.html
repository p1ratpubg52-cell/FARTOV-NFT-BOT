<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <title>Инвентарь — FART2</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #07090e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        calc(28px + env(safe-area-inset-bottom));
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .back {
      border: 1px solid #323846;
      background: #171c25;
      color: #fff;
      border-radius: 16px;
      padding: 11px 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 800;
      font-size: 20px;
    }

    .hero {
      border-radius: 30px;
      padding: 25px 22px;
      background: linear-gradient(135deg, #25c58f, #147561);
      margin-bottom: 18px;
    }

    .hero-badge {
      display: inline-block;
      background: #fff;
      color: #218069;
      border-radius: 16px;
      padding: 8px 13px;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: 34px;
      font-weight: 950;
      line-height: 1;
      margin-bottom: 10px;
    }

    .hero-text {
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
      color: rgba(255,255,255,.94);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 14px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 900;
    }

    .count {
      color: #aeb4bf;
      font-size: 14px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .gift-card {
      background: #12161e;
      border: 1px solid #2d3440;
      border-radius: 22px;
      overflow: hidden;
    }

    .gift-image-wrap {
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, #171d26, #0d1117);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gift-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      font-size: 54px;
    }

    .gift-info {
      padding: 13px;
    }

    .gift-name {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.25;
      min-height: 40px;
    }

    .gift-status {
      display: inline-block;
      margin-top: 9px;
      padding: 6px 9px;
      border-radius: 10px;
      background: rgba(121, 92, 255, .15);
      color: #a996ff;
      font-size: 12px;
      font-weight: 800;
    }

    .action-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }

    .withdraw-btn {
      background: linear-gradient(135deg, #675cff, #a34dff);
    }

    .sell-btn {
      background: linear-gradient(135deg, #f6a400, #ff7a00);
    }

    .sell-loading {
      background: #303642;
      color: #cbd0d8;
    }

    .action-btn:disabled {
      opacity: .65;
    }

    .empty {
      display: none;
      background: #12161e;
      border: 1px solid #2d3440;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      color: #aeb4bf;
    }

    .empty.show {
      display: block;
    }

    .loading {
      text-align: center;
      color: #9da3ad;
      padding: 24px;
      font-size: 15px;
    }

    .error {
      display: none;
      margin-bottom: 14px;
      padding: 13px;
      border-radius: 16px;
      background: #1b1518;
      border: 1px solid rgba(255, 92, 92, .5);
      color: #ffb5b5;
      line-height: 1.4;
    }

    .error.show {
      display: block;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 16px;
      border-radius: 14px;
      background: #242a34;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      display: none;
      z-index: 99999;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 390px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <button
      class="back"
      type="button"
      onclick="window.location.href='/'"
    >
      ← Назад
    </button>

    <div class="brand">
      FART2 NFT BOT
    </div>

    <div style="width:76px"></div>
  </div>

  <section class="hero">
    <div class="hero-badge">🎒 NFT</div>

    <div class="hero-title">
      ИНВЕНТАРЬ
    </div>

    <div class="hero-text">
      Здесь находятся все ваши подтверждённые подарки и NFT.
    </div>
  </section>

  <div id="errorBox" class="error"></div>

  <div class="toolbar">
    <div class="section-title">
      Мои подарки
    </div>

    <div id="count" class="count">
      0 шт.
    </div>
  </div>

  <div id="loading" class="loading">
    Загружаем инвентарь…
  </div>

  <div id="grid" class="grid"></div>

  <div id="empty" class="empty">
    Инвентарь пуст
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
(() => {
  const tg = window.Telegram?.WebApp || null;

  try {
    tg?.ready();
    tg?.expand();
  } catch (_) {}

  function getInitData() {
    if (!tg?.initData) {
      throw new Error("Откройте мини-приложение внутри Telegram");
    }

    return tg.initData;
  }

  function showError(message) {
    const box = document.getElementById("errorBox");
    box.textContent = message;
    box.classList.add("show");
  }

  function hideError() {
    document.getElementById("errorBox").classList.remove("show");
  }

  function showToast(message, timeout = 3500) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.inventoryToastTimer);

    window.inventoryToastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, timeout);
  }

  async function post(url, body) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);

    try {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body),
        signal: controller.signal
      });

      let data = {};

      try {
        data = await response.json();
      } catch (_) {}

      if (!response.ok) {
        throw new Error(
          data?.detail ||
          data?.error ||
          data?.message ||
          `Ошибка сервера ${response.status}`
        );
      }

      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  function escapeHtml(text) {
    return String(text || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderGift(gift) {
    const winId = Number(gift.case_win_id || 0);

    const image = gift.gift_image
      ? `
        <img
          class="gift-image"
          src="${escapeHtml(gift.gift_image)}"
          alt=""
        >
      `
      : `
        <div class="placeholder">🎁</div>
      `;

    return `
      <div class="gift-card" data-card-id="${winId}">
        <div class="gift-image-wrap">
          ${image}
        </div>

        <div class="gift-info">

          <div class="gift-name">
            ${escapeHtml(gift.gift_name || "Telegram Gift")}
          </div>

          <div class="gift-status">
            🎁 Выиграно в кейсе
          </div>

          <button
            class="action-btn withdraw-btn"
            type="button"
            data-withdraw-id="${winId}"
          >
            Вывести
          </button>

          <button
            class="action-btn sell-btn sell-loading"
            type="button"
            data-sell-id="${winId}"
            data-sell-price="0"
            disabled
          >
            ⭐ Получаем цену…
          </button>

        </div>
      </div>
    `;
  }

  async function loadQuote(winId) {
    const button = document.querySelector(
      `[data-sell-id="${winId}"]`
    );

    if (!button) return;

    try {
      const data = await post(
        "/api/cases/quote",
        {
          initData: getInitData(),
          win_id: winId
        }
      );

      const stars = Number(data.sell_stars || 0);

      if (stars > 0) {
        button.dataset.sellPrice = String(stars);
        button.textContent = `⭐ Продать за ${stars} Stars`;
        button.disabled = false;
        button.classList.remove("sell-loading");
      } else {
        button.textContent = "Цена рынка недоступна";
        button.disabled = true;
      }
    } catch (_) {
      button.textContent = "Цена рынка недоступна";
      button.disabled = true;
    }
  }

  function bindWithdrawButtons() {
    document.querySelectorAll("[data-withdraw-id]").forEach(button => {
      button.addEventListener("click", async () => {
        const winId = Number(button.dataset.withdrawId || 0);

        if (!winId) return;

        button.disabled = true;

        const old = button.textContent;

        button.textContent = "Отправляем…";

        try {
          await post(
            "/api/cases/withdraw",
            {
              initData: getInitData(),
              win_id: winId
            }
          );

          showToast("Заявка на вывод отправлена");

          document
            .querySelector(`[data-card-id="${winId}"]`)
            ?.remove();

          updateCount();

        } catch (error) {
          button.disabled = false;
          button.textContent = old;

          showError(
            "Ошибка вывода: " + error.message
          );
        }
      });
    });
  }

  function bindSellButtons() {
    document.querySelectorAll("[data-sell-id]").forEach(button => {
      button.addEventListener("click", async () => {
        const winId = Number(button.dataset.sellId || 0);
        const shownPrice = Number(button.dataset.sellPrice || 0);

        if (!winId || shownPrice <= 0) return;

        const ok = window.confirm(
          `Продать подарок за ${shownPrice} Stars?`
        );

        if (!ok) return;

        button.disabled = true;

        const old = button.textContent;

        button.textContent = "Проверяем цену…";

        try {
          const data = await post(
            "/api/cases/sell",
            {
              initData: getInitData(),
              win_id: winId
            }
          );

          showToast(
            `⭐ Продано за ${Number(data.credited_stars || 0)} Stars`
          );

          document
            .querySelector(`[data-card-id="${winId}"]`)
            ?.remove();

          updateCount();

        } catch (error) {
          button.disabled = false;
          button.textContent = old;

          showError(
            "Ошибка продажи: " + error.message
          );
        }
      });
    });
  }

  function updateCount() {
    const cards = document.querySelectorAll(".gift-card").length;

    document.getElementById("count").textContent =
      `${cards} шт.`;

    document.getElementById("empty").classList.toggle(
      "show",
      cards === 0
    );
  }

  async function loadInventory() {
    const loading = document.getElementById("loading");
    const grid = document.getElementById("grid");

    loading.style.display = "block";

    try {
      hideError();

      const data = await post(
        "/api/me",
        {
          initData: getInitData()
        }
      );

      const gifts = (data.deposits || []).filter(item =>
        item.status === "approved" &&
        Number(item.hidden || 0) === 0 &&
        (
          item.source === "case" ||
          String(item.id || "").startsWith("case:")
        )
      );

      grid.innerHTML = gifts
        .map(renderGift)
        .join("");

      updateCount();

      bindWithdrawButtons();
      bindSellButtons();

      gifts.forEach(gift => {
        const winId = Number(gift.case_win_id || 0);

        if (winId > 0) {
          loadQuote(winId);
        }
      });

    } catch (error) {

      showError(
        error.name === "AbortError"
          ? "Сервер слишком долго отвечает. Обновите страницу."
          : "Ошибка: " + error.message
      );

    } finally {
      loading.style.display = "none";
    }
  }

  loadInventory();

})();
</script>

</body>
</html>
