<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Админ — FART2 NFT BOT</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      min-height:100%;
      background:#07090e;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    body{
      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        calc(28px + env(safe-area-inset-bottom));
    }

    button,input,select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .wrap{
      width:100%;
      max-width:760px;
      margin:0 auto;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .title{
      font-size:24px;
      font-weight:800;
    }

    .subtitle{
      margin-top:5px;
      font-size:13px;
      color:#8f96a8;
    }

    .back{
      border:1px solid #262b38;
      background:#11151e;
      color:#fff;
      border-radius:12px;
      padding:10px 13px;
      font-weight:700;
    }

    .main-tabs{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:14px;
    }

    .main-tab{
      border:1px solid #252c3a;
      background:#11151e;
      color:#9da5b7;
      padding:14px 8px;
      border-radius:14px;
      font-weight:800;
    }

    .main-tab.active{
      color:#fff;
      border-color:#7b57ff;
      background:linear-gradient(135deg,#6e49ff,#944cff);
    }

    .page{
      display:none;
    }

    .page.active{
      display:block;
    }

    .card{
      background:#10141d;
      border:1px solid #1f2532;
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
    }

    .section-title{
      font-size:16px;
      font-weight:800;
      margin-bottom:12px;
    }

    .case-tabs{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .case-tab{
      border:1px solid #252c3a;
      background:#151a24;
      color:#aeb5c5;
      min-height:46px;
      border-radius:13px;
      font-weight:800;
    }

    .case-tab.active{
      color:#fff;
      border-color:#7b57ff;
      background:linear-gradient(135deg,#6e49ff,#944cff);
    }

    .type-tabs{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-bottom:14px;
    }

    .type-tab{
      border:1px solid #2a3140;
      background:#0b0f16;
      color:#aeb5c5;
      border-radius:12px;
      padding:11px 6px;
      font-weight:800;
      font-size:12px;
    }

    .type-tab.active{
      color:#fff;
      border-color:#7b57ff;
      background:#242038;
    }

    .field{
      margin-bottom:12px;
    }

    .label{
      display:block;
      color:#949cad;
      font-size:12px;
      font-weight:700;
      margin-bottom:7px;
    }

    .input,
    .select{
      width:100%;
      border:1px solid #2a3140;
      background:#0b0f16;
      color:#fff;
      border-radius:13px;
      padding:13px 14px;
      outline:none;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 140px;
      gap:10px;
    }

    .btn{
      width:100%;
      border:0;
      border-radius:14px;
      padding:13px 15px;
      font-weight:800;
    }

    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,#6d49ff,#9b4dff);
    }

    .btn-secondary{
      color:#fff;
      background:#171c27;
      border:1px solid #2b3241;
    }

    .btn-danger{
      color:#ff9ca8;
      background:#241318;
      border:1px solid #4d202a;
    }

    .summary{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      font-size:13px;
    }

    .summary strong{
      font-size:15px;
    }

    .ok{
      color:#70e19b;
    }

    .warn{
      color:#ffcb6b;
    }

    .items,
    .users,
    .upgrade-items{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .empty{
      color:#8f96a8;
      font-size:14px;
      text-align:center;
      padding:20px 8px;
    }

    .item{
      display:grid;
      grid-template-columns:58px 1fr;
      gap:12px;
      background:#0b0f16;
      border:1px solid #202634;
      border-radius:15px;
      padding:10px;
    }

    .thumb{
      width:58px;
      height:58px;
      border-radius:12px;
      overflow:hidden;
      background:#161b25;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#6f778a;
      font-size:11px;
      text-align:center;
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .name{
      font-weight:800;
      font-size:14px;
      margin-bottom:3px;
      word-break:break-word;
    }

    .url{
      color:#777f91;
      font-size:11px;
      word-break:break-all;
      margin-bottom:10px;
    }

    .item-actions{
      display:grid;
      grid-template-columns:110px 1fr 1fr;
      gap:8px;
    }

    .chance-input{
      width:100%;
      border:1px solid #2b3241;
      background:#121722;
      color:#fff;
      border-radius:10px;
      padding:10px;
    }

    .small{
      padding:10px;
      border-radius:10px;
      font-size:12px;
    }

    .message{
      display:none;
      margin-bottom:12px;
      border-radius:13px;
      padding:12px 13px;
      font-size:13px;
    }

    .message.show{
      display:block;
    }

    .message.error{
      background:#29151a;
      border:1px solid #57242d;
      color:#ff9ca8;
    }

    .message.success{
      background:#10251a;
      border:1px solid #235b3a;
      color:#7ee3a3;
    }

    .loading{
      opacity:.65;
      pointer-events:none;
    }

    .user-count,
    .upgrade-count{
      color:#8f96a8;
      font-size:13px;
      margin-top:9px;
    }

    .user-card,
    .upgrade-card{
      background:#10141d;
      border:1px solid #1f2532;
      border-radius:18px;
      padding:15px;
    }

    .user-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:13px;
    }

    .player-number{
      font-size:17px;
      font-weight:900;
    }

    .username{
      margin-top:4px;
      font-size:13px;
      color:#aeb5c5;
    }

    .tg-id{
      color:#737c90;
      font-size:11px;
      text-align:right;
      word-break:break-all;
    }

    .balances-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
      margin-bottom:12px;
    }

    .balance-box{
      background:#0b0f16;
      border:1px solid #232a38;
      border-radius:12px;
      padding:10px;
    }

    .balance-label{
      color:#7f8798;
      font-size:11px;
      margin-bottom:4px;
    }

    .balance-value{
      font-size:15px;
      font-weight:900;
      word-break:break-word;
    }

    .user-date{
      color:#737c90;
      font-size:11px;
      margin-bottom:11px;
    }

    .editor{
      display:none;
      border-top:1px solid #202634;
      padding-top:12px;
      margin-top:12px;
    }

    .editor.open{
      display:block;
    }

    .editor-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .editor-actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:8px;
    }

    .operation{
      border:1px solid #2b3241;
      background:#171c27;
      color:#fff;
      border-radius:11px;
      padding:11px 5px;
      font-weight:800;
      font-size:12px;
    }

    .operation.add{
      border-color:#235b3a;
      color:#7ee3a3;
    }

    .operation.subtract{
      border-color:#57242d;
      color:#ff9ca8;
    }

    .operation.set{
      border-color:#6248b7;
      color:#bba9ff;
    }

    .upgrade-toolbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:9px;
      align-items:end;
    }

    .refresh-upgrade{
      width:auto;
      padding:13px 16px;
    }

    .upgrade-main{
      display:grid;
      grid-template-columns:66px 1fr;
      gap:12px;
    }

    .upgrade-thumb{
      width:66px;
      height:66px;
      border-radius:14px;
      overflow:hidden;
      background:#0b0f16;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
    }

    .upgrade-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .upgrade-name{
      font-size:15px;
      font-weight:900;
    }

    .upgrade-id{
      font-size:10px;
      color:#727a8d;
      margin-top:3px;
      word-break:break-all;
    }

    .price-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:12px;
    }

    .price-box{
      background:#0b0f16;
      border:1px solid #232a38;
      border-radius:12px;
      padding:10px;
    }

    .price-title{
      font-size:11px;
      color:#81899a;
      margin-bottom:4px;
    }

    .price-value{
      font-size:16px;
      font-weight:900;
    }

    .admin-price{
      color:#8effb6;
    }

    .claimed{
      color:#ffcb6b;
      font-size:11px;
      margin-top:5px;
    }

    .upgrade-edit{
      display:grid;
      grid-template-columns:1fr 120px 120px;
      gap:8px;
      margin-top:12px;
    }

    .price-input{
      width:100%;
      border:1px solid #2b3241;
      background:#121722;
      color:#fff;
      border-radius:11px;
      padding:11px;
    }

    @media(max-width:560px){

      .main-tabs{
        grid-template-columns:1fr;
      }

      .row{
        grid-template-columns:1fr;
      }

      .case-tabs{
        grid-template-columns:repeat(2,1fr);
      }

      .type-tabs{
        grid-template-columns:repeat(2,1fr);
      }

      .item-actions{
        grid-template-columns:1fr 1fr;
      }

      .chance-input{
        grid-column:1/-1;
      }

      .editor-grid,
      .editor-actions{
        grid-template-columns:1fr;
      }

      .upgrade-edit{
        grid-template-columns:1fr 1fr;
      }

      .upgrade-edit .price-input{
        grid-column:1/-1;
      }

      .upgrade-toolbar{
        grid-template-columns:1fr;
      }

      .refresh-upgrade{
        width:100%;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div>

      <div class="title">
        Админ-панель
      </div>

      <div class="subtitle">
        FART2 NFT BOT
      </div>

    </div>

    <button
      class="back"
      id="backBtn"
    >
      ← Назад
    </button>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <div class="main-tabs">

    <button
      class="main-tab active"
      data-page="cases"
    >
      🎁 Кейсы
    </button>

    <button
      class="main-tab"
      data-page="upgrade"
    >
      ⚡ Upgrade
    </button>

    <button
      class="main-tab"
      data-page="users"
    >
      👥 Пользователи
    </button>

  </div>


  <div id="content">


    <!-- =============================
         КЕЙСЫ
    ============================== -->

    <div
      class="page active"
      id="casesPage"
    >

      <div class="card">

        <div class="section-title">
          Выбери кейс
        </div>

        <div class="case-tabs">

          <button
            class="case-tab active"
            data-case="1"
          >
            Кейс №1
          </button>

          <button
            class="case-tab"
            data-case="2"
          >
            Кейс №2
          </button>

          <button
            class="case-tab"
            data-case="3"
          >
            Кейс №3
          </button>

          <button
            class="case-tab"
            data-case="4"
          >
            Кейс №4
          </button>

        </div>

      </div>


      <div class="card">

        <div class="section-title">
          Добавить приз
        </div>

        <div class="type-tabs">

          <button
            class="type-tab active"
            data-type="nft"
          >
            NFT
          </button>

          <button
            class="type-tab"
            data-type="bear"
          >
            🐻 Мишка
          </button>

          <button
            class="type-tab"
            data-type="heart"
          >
            ❤️ Сердце
          </button>

          <button
            class="type-tab"
            data-type="failure"
          >
            ❌ Неудача
          </button>

        </div>


        <div
          class="field"
          id="giftUrlField"
        >

          <label class="label">
            Ссылка Telegram NFT
          </label>

          <input
            class="input"
            id="giftUrl"
            type="url"
            placeholder="https://t.me/nft/..."
          >

        </div>


        <div class="row">

          <div class="field">

            <label class="label">
              Шанс выпадения, %
            </label>

            <input
              class="input"
              id="chanceInput"
              type="number"
              min="0.0001"
              max="100"
              step="0.1"
              placeholder="5"
            >

          </div>


          <div
            class="field"
            style="display:flex;align-items:flex-end"
          >

            <button
              class="btn btn-primary"
              id="addBtn"
            >
              Добавить
            </button>

          </div>

        </div>

      </div>


      <div class="card">

        <div class="summary">

          <span>
            Настроено
          </span>

          <strong id="totalText">
            0% / 100%
          </strong>

        </div>


        <div class="summary">

          <span>
            Свободно
          </span>

          <strong
            class="ok"
            id="remainingText"
          >
            100%
          </strong>

        </div>


        <div
          class="items"
          id="items"
        ></div>

      </div>

    </div>


    <!-- =============================
         UPGRADE
    ============================== -->

    <div
      class="page"
      id="upgradePage"
    >

      <div class="card">

        <div class="section-title">
          Цены целей Upgrade
        </div>


        <div class="upgrade-toolbar">

          <div>

            <label class="label">
              Поиск NFT
            </label>

            <input
              id="upgradeSearch"
              class="input"
              type="text"
              placeholder="Название или ID подарка"
            >

          </div>


          <button
            id="upgradeRefresh"
            class="btn btn-secondary refresh-upgrade"
          >
            ↻ Обновить
          </button>

        </div>


        <div
          id="upgradeCount"
          class="upgrade-count"
        >
          Загрузка...
        </div>

      </div>


      <div
        id="upgradeItems"
        class="upgrade-items"
      ></div>

    </div>


    <!-- =============================
         ПОЛЬЗОВАТЕЛИ
    ============================== -->

    <div
      class="page"
      id="usersPage"
    >

      <div class="card">

        <div class="section-title">
          Пользователи
        </div>

        <input
          class="input"
          id="userSearch"
          type="text"
          placeholder="Поиск: № игрока, @username, имя или Telegram ID"
        >

        <div
          class="user-count"
          id="userCount"
        >
          Загрузка...
        </div>

      </div>


      <div
        class="users"
        id="usersBox"
      ></div>

    </div>

  </div>

</div>


<script>

const tg =
  window.Telegram?.WebApp;


if(tg){

  tg.ready();

  tg.expand();

}


const initData =
  tg?.initData || "";


let selectedCase = 1;

let selectedType = "nft";


let dataByCase = {

  "1":[],

  "2":[],

  "3":[],

  "4":[]

};


let usersData = [];

let upgradeData = [];


const $ =
  id =>
    document.getElementById(id);


const content =
  $("content");

const message =
  $("message");

const itemsBox =
  $("items");

const totalText =
  $("totalText");

const remainingText =
  $("remainingText");

const giftUrl =
  $("giftUrl");

const giftUrlField =
  $("giftUrlField");

const chanceInput =
  $("chanceInput");

const addBtn =
  $("addBtn");

const backBtn =
  $("backBtn");

const usersBox =
  $("usersBox");

const userSearch =
  $("userSearch");

const userCount =
  $("userCount");

const upgradeItems =
  $("upgradeItems");

const upgradeSearch =
  $("upgradeSearch");

const upgradeCount =
  $("upgradeCount");

const upgradeRefresh =
  $("upgradeRefresh");


function showMessage(
  text,
  type="error"
){

  message.textContent =
    text;


  message.className =
    `message show ${type}`;


  setTimeout(
    ()=>{
      message.className =
        "message";
    },
    4000
  );

}


async function post(
  url,
  body
){

  const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(body)

      }
    );


  let data = {};


  try{

    data =
      await response.json();

  }catch(e){}


  if(
    !response.ok
  ){

    throw new Error(

      data.detail ||

      data.error ||

      data.message ||

      `Ошибка ${response.status}`

    );

  }


  return data;

}


function setLoading(
  value
){

  content.classList.toggle(
    "loading",
    value
  );

}


function esc(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


async function checkAdmin(){

  if(
    !initData
  ){

    throw new Error(
      "Открой страницу внутри Telegram Mini App."
    );

  }


  const result =
    await post(
      "/api/admin/status",
      {
        initData:initData
      }
    );


  if(
    !result.is_admin
  ){

    throw new Error(
      "Доступ запрещён."
    );

  }

}


/* =========================================================
   ГЛАВНЫЕ ВКЛАДКИ
========================================================= */

document
.querySelectorAll(
  ".main-tab"
)
.forEach(
  btn=>{

    btn.addEventListener(
      "click",
      async()=>{

        const page =
          btn.dataset.page;


        document
        .querySelectorAll(
          ".main-tab"
        )
        .forEach(
          x=>{

            x.classList.toggle(
              "active",
              x === btn
            );

          }
        );


        document
        .querySelectorAll(
          ".page"
        )
        .forEach(
          x=>{

            x.classList.remove(
              "active"
            );

          }
        );


        $(
          page + "Page"
        )
        .classList
        .add(
          "active"
        );


        if(
          page === "users"
        ){

          await loadUsers();

        }


        if(
          page === "upgrade"
        ){

          await loadUpgrade();

        }

      }
    );

  }
);


/* =========================================================
   КЕЙСЫ
========================================================= */

function getItems(){

  return (
    dataByCase[
      String(selectedCase)
    ] || []
  );

}


function calcTotal(){

  return getItems().reduce(
    (
      sum,
      item
    )=>

      sum +
      Number(
        item.chance_percent ||
        0
      ),

    0
  );

}


function fmtPct(
  value
){

  const n =
    Number(
      value || 0
    );


  return (

    Number.isInteger(n)

      ? n

      : n
        .toFixed(4)
        .replace(/0+$/,"")
        .replace(/\.$/,"")

  ) + "%";

}


function renderSummary(){

  const total =
    calcTotal();


  const remaining =
    Math.max(
      0,
      100-total
    );


  totalText.textContent =
    `${fmtPct(total)} / 100%`;


  remainingText.textContent =
    fmtPct(
      remaining
    );


  remainingText.className =
    remaining <= 0
      ? "warn"
      : "ok";

}


function renderItems(){

  const items =
    getItems();


  renderSummary();


  if(
    !items.length
  ){

    itemsBox.innerHTML = `
      <div class="empty">
        В этом кейсе пока нет призов, добавленных через админку.
      </div>
    `;

    return;

  }


  itemsBox.innerHTML =
    items.map(
      item=>{

        const type =
          item.item_type ||
          "nft";


        const label = {

          nft:"NFT",

          bear:"🐻 Мишка",

          heart:"❤️ Сердце",

          failure:"❌ Неудача"

        }[type] || "NFT";


        const fallback =

          type === "bear"

            ? "/static/case1-bear-clean.png"

            : type === "heart"

              ? "/static/case1-heart-clean.png"

              : "";


        const image =
          item.gift_image ||
          fallback;


        return `
          <div
            class="item"
            data-id="${item.id}"
          >

            <div class="thumb">

              ${
                image

                  ? `<img src="${esc(image)}">`

                  : label
              }

            </div>


            <div>

              <div class="name">

                ${esc(
                  item.gift_name ||
                  label
                )}

              </div>


              <div class="url">

                ${esc(
                  item.gift_url ||
                  ""
                )}

              </div>


              <div class="item-actions">

                <input
                  class="chance-input"
                  type="number"
                  min="0.0001"
                  max="100"
                  step="0.1"
                  value="${Number(
                    item.chance_percent
                  )}"
                  data-role="chance"
                >


                <button
                  class="btn btn-secondary small"
                  data-action="save"
                  data-id="${item.id}"
                >
                  Сохранить
                </button>


                <button
                  class="btn btn-danger small"
                  data-action="delete"
                  data-id="${item.id}"
                >
                  Удалить
                </button>

              </div>

            </div>

          </div>
        `;

      }
    )
    .join("");

}


async function loadItems(){

  setLoading(
    true
  );


  try{

    const result =
      await post(
        "/api/admin/cases/items",
        {
          initData:initData
        }
      );


    dataByCase =
      result.cases || {

        "1":[],

        "2":[],

        "3":[],

        "4":[]

      };


    renderItems();

  }

  finally{

    setLoading(
      false
    );

  }

}


function selectType(
  type
){

  selectedType =
    type;


  document
  .querySelectorAll(
    ".type-tab"
  )
  .forEach(
    btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.type === type
      );

    }
  );


  giftUrlField.style.display =
    type === "nft"
      ? "block"
      : "none";

}


document
.querySelectorAll(
  ".type-tab"
)
.forEach(
  btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        selectType(
          btn.dataset.type
        );

      }
    );

  }
);


async function addItem(){

  const url =
    giftUrl.value.trim();


  const p =
    Number(
      chanceInput.value
    );


  if(
    selectedType === "nft"
    &&
    !url
  ){

    showMessage(
      "Вставь ссылку на NFT."
    );

    return;

  }


  if(
    !Number.isFinite(p)
    ||
    p <= 0
    ||
    p > 100
  ){

    showMessage(
      "Шанс должен быть больше 0 и не больше 100%."
    );

    return;

  }


  addBtn.disabled =
    true;


  try{

    await post(
      "/api/admin/cases/add",
      {

        initData:initData,

        case_id:
          selectedCase,

        gift_url:
          url,

        chance_percent:
          p,

        item_type:
          selectedType

      }
    );


    giftUrl.value =
      "";


    chanceInput.value =
      "";


    await loadItems();


    showMessage(
      `Приз добавлен в кейс №${selectedCase}`,
      "success"
    );

  }

  catch(error){

    showMessage(
      error.message
    );

  }

  finally{

    addBtn.disabled =
      false;

  }

}


async function saveChance(
  itemId,
  button
){

  const item =
    button.closest(
      ".item"
    );


  const input =
    item.querySelector(
      '[data-role="chance"]'
    );


  const p =
    Number(
      input.value
    );


  if(
    !Number.isFinite(p)
    ||
    p <= 0
    ||
    p > 100
  ){

    showMessage(
      "Неверный процент."
    );

    return;

  }


  try{

    await post(
      "/api/admin/cases/update",
      {

        initData:initData,

        item_id:
          Number(itemId),

        chance_percent:
          p

      }
    );


    await loadItems();


    showMessage(
      "Процент сохранён.",
      "success"
    );

  }

  catch(error){

    showMessage(
      error.message
    );

  }

}


async function deleteItem(
  itemId
){

  if(
    !confirm(
      "Удалить приз из кейса?"
    )
  ){

    return;

  }


  try{

    await post(
      "/api/admin/cases/delete",
      {

        initData:initData,

        item_id:
          Number(itemId)

      }
    );


    await loadItems();


    showMessage(
      "Приз удалён.",
      "success"
    );

  }

  catch(error){

    showMessage(
      error.message
    );

  }

}


document
.querySelectorAll(
  ".case-tab"
)
.forEach(
  btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        selectedCase =
          Number(
            btn.dataset.case
          );


        document
        .querySelectorAll(
          ".case-tab"
        )
        .forEach(

      }
    );

);


addBtn.addEventListener(
  "click",
  addItem
);


itemsBox.addEventListener(
  "click",
  event=>{

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if(
      !button
    ){

      return;

    }


    if(
      button.dataset.action ===

/* =========================================================
   UPGRADE
========================================================= */

async function loadUpgrade(){

  setLoading(
    true
  );


  upgradeItems.innerHTML = `
    <div class="card empty">
      Загрузка NFT и цен…
    </div>
  `;


  try{

    const result =
      await post(
        "/api/admin/upgrade/items",
        {
          initData:initData
        }
      );


    upgradeData =
      result.items ||
      [];


    renderUpgrade();


    if(
      result.warning
    ){

      showMessage(
        result.warning
      );

    }

  }

  catch(error){

    upgradeItems.innerHTML = `
      <div class="card empty">
        ${esc(error.message)}
      </div>
    `;


    showMessage(
      error.message
    );

  }

  finally{

    setLoading(
      false
    );

  }

}


function renderUpgrade(){

  const query =
    upgradeSearch.value
      .trim()
      .toLowerCase();


  const filtered =
    upgradeData.filter(
      item=>{

        if(
          !query
        ){

          return true;

        }


        return (

          String(
            item.name || ""
          )
          .toLowerCase()
          .includes(
            query
          )

          ||

          String(
            item.id || ""
          )
          .toLowerCase()
          .includes(
            query
          )

        );

      }
    );


  upgradeCount.textContent =

    query

      ? `Найдено: ${filtered.length} из ${upgradeData.length}`

      : `Всего целей: ${upgradeData.length}`;


  if(
    !filtered.length
  ){

    upgradeItems.innerHTML = `
      <div class="card empty">
        NFT не найдены.
      </div>
    `;

    return;

  }


  upgradeItems.innerHTML =
    filtered.map(
      item=>{

        const marketPrice =
          Number(
            item.market_price_stars ||
            0
          );


        const price =
          Number(
            item.price_stars ||
            0
          );


        const customPrice =
          Number(
            item.custom_price_stars ||
            0
          );


        return `
          <div
            class="upgrade-card"
            data-target-id="${esc(item.id)}"
          >

            <div class="upgrade-main">

              <div class="upgrade-thumb">

                ${
                  item.image_url

                    ? `
                      <img
                        src="${esc(item.image_url)}"
                        alt=""
                      >
                    `

                    : "🎁"
                }

              </div>


              <div>

                <div class="upgrade-name">

                  ${esc(
                    item.name
                  )}

                </div>


                <div class="upgrade-id">

                  ${esc(
                    item.id
                  )}

                </div>


                ${
                  item.claimed

                    ? `
                      <div class="claimed">
                        Сейчас уже выдан пользователю и не показывается как цель
                      </div>
                    `

                    : ""
                }

              </div>

            </div>


            <div class="price-grid">

              <div class="price-box">

                <div class="price-title">
                  Рыночная цена Telegram
                </div>

                <div class="price-value">

                  ${marketPrice.toLocaleString(
                    "ru-RU"
                  )}
                  ⭐

                </div>

              </div>


              <div class="price-box">

                <div class="price-title">
                  Цена в Upgrade
                </div>

                <div
                  class="
                    price-value
                    ${
                      customPrice > 0
                        ? "admin-price"
                        : ""
                    }
                  "
                >

                  ${price.toLocaleString(
                    "ru-RU"
                  )}
                  ⭐

                </div>

              </div>

            </div>


            <div class="upgrade-edit">

              <input
                class="price-input"
                data-role="upgrade-price"
                type="number"
                min="1"
                step="1"
                value="${
                  customPrice ||
                  price ||
                  0
                }"
                placeholder="Цена в Stars"
              >


              <button
                class="btn btn-primary small"
                data-upgrade-action="save"
              >
                Сохранить
              </button>


              <button
                class="btn btn-secondary small"
                data-upgrade-action="reset"
              >
                Рынок
              </button>

            </div>

          </div>
        `;

      }
    )
    .join("");

}


upgradeSearch.addEventListener(
  "input",
  renderUpgrade
);


upgradeRefresh.addEventListener(
  "click",
  loadUpgrade
);


upgradeItems.addEventListener(
  "click",
  async event=>{

    const button =
      event.target.closest(
        "[data-upgrade-action]"
      );


    if(
      !button
    ){

      return;

    }


    const card =
      button.closest(
        ".upgrade-card"
      );


    const targetId =
      card.dataset.targetId;


    const action =
      button.dataset.upgradeAction;


    button.disabled =
      true;


    try{

      if(
        action === "save"
      ){

        const input =
          card.querySelector(
            '[data-role="upgrade-price"]'
          );


        const price =
          Number(
            input.value
          );


        if(
          !Number.isInteger(price)
          ||
          price <= 0
        ){

          throw new Error(
            "Цена должна быть целым числом больше 0 Stars"
          );

        }


        await post(
          "/api/admin/upgrade/price",
          {

            initData:initData,

            target_id:
              targetId,

            price_stars:
              price

          }
        );


        showMessage(
          `Цена сохранена: ${price.toLocaleString("ru-RU")} ⭐`,
          "success"
        );

      }

      else{

        await post(
          "/api/admin/upgrade/price/reset",
          {

            initData:initData,

            target_id:
              targetId

          }
        );


        showMessage(
          "Вернул рыночную цену Telegram.",
          "success"
        );

      }


      await loadUpgrade();

    }

    catch(error){

      showMessage(
        error.message
      );

    }

    finally{

      button.disabled =
        false;

    }

  }
);


/* =========================================================
   ПОЛЬЗОВАТЕЛИ
========================================================= */

async function loadUsers(){

  setLoading(
    true
  );


  try{

    const result =
      await post(
        "/api/admin/users",
        {
          initData:initData
        }
      );


    usersData =
      result.users ||
      [];


    renderUsers();

  }

  catch(error){

    showMessage(
      error.message
    );

  }

  finally{

    setLoading(
      false
    );

  }

}


function renderUsers(){

  const query =
    userSearch.value
      .trim()
      .toLowerCase()
      .replace(/^@/,"");


  const filtered =
    usersData.filter(
      user=>{

        if(
          !query
        ){

          return true;

        }


        const values = [

          String(
            user.player_number
          ),

          String(
            user.user_id
          ),

          String(
            user.username ||
            ""
          )
          .toLowerCase(),

          String(
            user.first_name ||
            ""
          )
          .toLowerCase()

        ];


        return values.some(
          value=>

            value.includes(
              query
            )

        );

      }
    );


  userCount.textContent =

    query

      ? `Найдено: ${filtered.length} из ${usersData.length}`

      : `Всего игроков: ${usersData.length}`;


  if(
    !filtered.length
  ){

    usersBox.innerHTML = `
      <div class="card empty">
        Пользователи не найдены.
      </div>
    `;

    return;

  }


  usersBox.innerHTML =
    filtered.map(
      user=>{

        const username =

          user.username

            ? "@" +
              esc(
                user.username
              )

            : "без username";


        const firstName =

          user.first_name

            ? esc(
                user.first_name
              )

            : "";


        const balances =
          user.balances ||
          {};


        return `
          <div
            class="user-card"
            data-user-id="${user.user_id}"
          >

            <div class="user-head">

              <div>

                <div class="player-number">
                  Игрок №${user.player_number}
                </div>


                <div class="username">

                  ${username}

                  ${
                    firstName
                      ? " · " + firstName
                      : ""
                  }

                </div>

              </div>


              <div class="tg-id">

                Telegram ID
                <br>

                ${user.user_id}

              </div>

            </div>


            <div class="balances-grid">

              <div class="balance-box">

                <div class="balance-label">
                  ⭐ Stars
                </div>

                <div class="balance-value">

                  ${esc(
                    balances.XTR ||
                    "0"
                  )}

                </div>

              </div>


              <div class="balance-box">

                <div class="balance-label">
                  TON
                </div>

                <div class="balance-value">

                  ${esc(
                    balances.TON ||
                    "0"
                  )}

                </div>

              </div>


              <div class="balance-box">

                <div class="balance-label">
                  USDT
                </div>

                <div class="balance-value">

                  ${esc(
                    balances.USDT ||
                    "0"
                  )}

                </div>

              </div>


              <div class="balance-box">

                <div class="balance-label">
                  GRAM
                </div>

                <div class="balance-value">

                  ${esc(
                    balances.GRAM ||
                    "0"
                  )}

                </div>

              </div>

            </div>


            <div class="user-date">

              Регистрация:
              ${esc(
                user.created_at ||
                "—"
              )}

            </div>


            <button
              class="btn btn-secondary"
              data-user-action="toggle"
            >
              Изменить баланс
            </button>


            <div class="editor">

              <div class="editor-grid">

                <div>

                  <label class="label">
                    Валюта
                  </label>

                  <select
                    class="select"
                    data-role="currency"
                  >

                    <option value="XTR">
                      ⭐ Stars
                    </option>

                    <option value="TON">
                      TON
                    </option>

                    <option value="USDT">
                      USDT
                    </option>

                    <option value="GRAM">
                      GRAM
                    </option>

                  </select>

                </div>


                <div>

                  <label class="label">
                    Сумма
                  </label>

                  <input
                    class="input"
                    data-role="amount"
                    type="number"
                    min="0"
                    step="any"
                    placeholder="100"
                  >

                </div>

              </div>


              <div class="editor-actions">

                <button
                  class="operation add"
                  data-user-action="balance"
                  data-operation="add"
                >
                  + Начислить
                </button>


                <button
                  class="operation subtract"
                  data-user-action="balance"
                  data-operation="subtract"
                >
                  − Списать
                </button>


                <button
                  class="operation set"
                  data-user-action="balance"
                  data-operation="set"
                >
                  = Установить
                </button>

              </div>

            </div>

          </div>
        `;

      }
    )
    .join("");

}


userSearch.addEventListener(
  "input",
  renderUsers
);


usersBox.addEventListener(
  "click",
  async event=>{

    const button =
      event.target.closest(
        "[data-user-action]"
      );


    if(
      !button
    ){

      return;

    }


    const card =
      button.closest(
        ".user-card"
      );


    if(
      !card
    ){

      return;

    }


    const userId =
      Number(
        card.dataset.userId
      );


    const action =
      button.dataset.userAction;


    if(
      action === "toggle"
    ){

      card
      .querySelector(
        ".editor"
      )
      .classList
      .toggle(
        "open"
      );


      return;

    }


    if(
      action !== "balance"
    ){

      return;

    }


    const operation =
      button.dataset.operation;


    const currency =
      card.querySelector(
        '[data-role="currency"]'
      ).value;


    const amountInput =
      card.querySelector(
        '[data-role="amount"]'
      );


    const amount =
      amountInput.value.trim();


    if(
      amount === ""
    ){

      showMessage(
        "Укажи сумму."
      );

      return;

    }


    const number =
      Number(
        amount
      );


    if(
      !Number.isFinite(number)
      ||
      number < 0
    ){

      showMessage(
        "Укажи правильную сумму."
      );

      return;

    }


    let actionText =
      "изменить";


    if(
      operation === "add"
    ){

      actionText =
        "начислить";

    }


    if(
      operation === "subtract"
    ){

      actionText =
        "списать";

    }


    if(
      operation === "set"
    ){

      actionText =
        "установить баланс";

    }


    if(
      !confirm(
        `${actionText} ${amount} ${currency} игроку ${userId}?`
      )
    ){

      return;

    }


    button.disabled =
      true;


    try{

      const result =
        await post(
          "/api/admin/users/balance",
          {

            initData:initData,

            user_id:
              userId,

            currency:
              currency,

            operation:
              operation,

            amount:
              amount

          }
        );


      amountInput.value =
        "";


      await loadUsers();


      showMessage(
        `Готово. Новый баланс ${currency}: ${result.new_balance}`,
        "success"
      );

    }

    catch(error){

      showMessage(
        error.message
      );

    }

    finally{

      button.disabled =
        false;

    }

  }
);

backBtn.addEventListener(

    window.location.href =

  }
);

  try{
