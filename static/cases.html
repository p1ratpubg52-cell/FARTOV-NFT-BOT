<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <title>Кейсы — FART2 NFT BOT</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent
    }

    html,body{
      width:100%;
      min-height:100%;
      background:#07090e;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      overflow-x:hidden
    }

    body{
      padding-bottom:env(safe-area-inset-bottom)
    }

    button{
      font-family:inherit;
      touch-action:manipulation
    }

    .app{
      width:100%;
      max-width:720px;
      margin:0 auto;
      padding:calc(18px + env(safe-area-inset-top)) 16px 40px
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:20px
    }

    .back-btn{
      border:1px solid #303846;
      background:#151a22;
      color:#fff;
      border-radius:16px;
      padding:13px 15px;
      font-size:14px;
      font-weight:850
    }

    .page-title{
      font-size:31px;
      font-weight:950;
      letter-spacing:-.8px
    }

    .page-subtitle{
      color:#7d8491;
      font-size:13px;
      margin-top:3px
    }

    .warning{
      display:none;
      margin-bottom:16px;
      border-radius:16px;
      padding:12px 14px;
      background:rgba(255,85,85,.08);
      border:1px solid rgba(255,85,85,.22);
      color:#ffb7b7;
      font-size:12px;
      line-height:1.45
    }

    .warning.show{
      display:block
    }

    .balances{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:18px
    }

    .balance-card{
      border-radius:19px;
      padding:15px;
      background:linear-gradient(145deg,#171c25,#10141a);
      border:1px solid #303846
    }

    .balance-label{
      color:#8d95a3;
      font-size:12px;
      margin-bottom:5px
    }

    .balance-value{
      font-size:22px;
      font-weight:900
    }

    .hero{
      border-radius:26px;
      padding:18px;
      margin-bottom:24px;
      border:1px solid #353d49;
      background:
        radial-gradient(circle at 85% 10%,rgba(149,80,255,.26),transparent 33%),
        linear-gradient(145deg,#1d212a,#12161c)
    }

    .hero-title{
      font-size:21px;
      font-weight:900;
      margin-bottom:13px
    }

    .preview-strip{
      position:relative;
      height:112px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px;
      overflow:hidden;
      border-radius:20px;
      background:#242832;
      border:1px solid rgba(255,255,255,.06)
    }

    .preview-item{
      flex:0 0 82px;
      width:82px;
      height:82px;
      border-radius:16px;
      overflow:hidden;
      background:#161a22;
      border:1px solid #3b4350
    }

    .preview-item img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .preview-line{
      position:absolute;
      top:0;
      bottom:0;
      left:50%;
      width:4px;
      transform:translateX(-50%);
      background:#8d69ff;
      box-shadow:0 0 16px rgba(141,105,255,.7);
      z-index:5
    }

    .deposit-btn{
      width:100%;
      margin-top:14px;
      border:0;
      border-radius:18px;
      padding:16px;
      color:#fff;
      font-size:16px;
      font-weight:900;
      background:linear-gradient(135deg,#675cff,#a34dff)
    }

    .section-title{
      font-size:22px;
      font-weight:950;
      margin:0 2px 14px
    }

    .cases{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px
    }

    .case{
      border-radius:25px;
      border:1px solid #313946;
      background:linear-gradient(145deg,#171c24,#11151b);
      padding:12px;
      overflow:hidden
    }

    .case:active{
      transform:scale(.985)
    }

    .case-art{
      position:relative;
      height:160px;
      margin-bottom:12px;
      border-radius:19px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:2px solid rgba(220,169,46,.75);
      background:
        radial-gradient(circle at 50% 35%,rgba(255,255,255,.13),transparent 25%),
        linear-gradient(180deg,#30343d,#23262e)
    }

    .case-thumbs{
      position:relative;
      width:115px;
      height:105px
    }

    .case-thumb{
      position:absolute;
      width:70px;
      height:70px;
      border-radius:15px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.16);
      box-shadow:0 8px 20px rgba(0,0,0,.32);
      background:#151922
    }

    .case-thumb img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .case-thumb:nth-child(1){
      left:0;
      bottom:0;
      transform:rotate(-8deg)
    }

    .case-thumb:nth-child(2){
      right:0;
      bottom:0;
      transform:rotate(8deg)
    }

    .case-thumb:nth-child(3){
      left:23px;
      top:0;
      z-index:3
    }

    .price-pill{
      position:absolute;
      top:10px;
      right:10px;
      z-index:6;
      background:#101217;
      border-radius:13px;
      padding:8px 11px;
      font-size:13px;
      font-weight:900
    }

    .case-name{
      font-size:18px;
      font-weight:900;
      margin-bottom:6px
    }

    .case-price{
      color:#969eaa;
      font-size:13px;
      line-height:1.35;
      min-height:38px;
      margin-bottom:10px
    }

    .case-btn{
      width:100%;
      border:0;
      border-radius:16px;
      padding:13px 8px;
      font-size:13px;
      font-weight:900;
      color:#fff;
      background:linear-gradient(135deg,#675cff,#a34dff)
    }

    .case-btn.low{
      background:linear-gradient(135deg,#ff7918,#ff4b4b)
    }

    .empty{
      grid-column:1/-1;
      border-radius:20px;
      padding:24px 16px;
      background:#151a22;
      border:1px solid #303846;
      color:#9098a5;
      font-size:14px;
      line-height:1.45;
      text-align:center
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      justify-content:center;
      align-items:flex-end;
      background:rgba(0,0,0,.80);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px)
    }

    .modal.active{
      display:flex
    }

    .sheet{
      width:100%;
      max-width:720px;
      max-height:90vh;
      overflow-y:auto;
      background:#11161e;
      border-radius:30px 30px 0 0;
      border:1px solid #303846;
      padding:19px 16px calc(25px + env(safe-area-inset-bottom))
    }

    .sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px
    }

    .sheet-title{
      font-size:25px;
      font-weight:950
    }

    .close-btn{
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      background:#292f39;
      color:#fff;
      font-size:20px
    }

    .sheet-price{
      color:#9ba3af;
      font-size:14px;
      margin-bottom:18px
    }

    .drop-heading{
      font-size:19px;
      font-weight:900;
      margin-bottom:12px
    }

    .drops{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:18px
    }

    .drop{
      border-radius:19px;
      overflow:hidden;
      background:linear-gradient(145deg,#1b2029,#131820);
      border:1px solid #343c49;
      padding:10px
    }

    .drop-image{
      width:100%;
      aspect-ratio:1/1;
      overflow:hidden;
      border-radius:15px;
      background:#222731;
      margin-bottom:9px
    }

    .drop-image img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .drop-name{
      font-size:13px;
      font-weight:850;
      line-height:1.3;
      min-height:34px
    }

    .drop-chance{
      color:#929aa7;
      font-size:11px;
      margin-top:5px
    }

    .drop-link{
      display:block;
      color:#8978ff;
      font-size:11px;
      margin-top:5px;
      text-decoration:none
    }

    .modal-action{
      width:100%;
      border:0;
      border-radius:18px;
      padding:16px;
      color:#fff;
      font-size:16px;
      font-weight:900;
      background:linear-gradient(135deg,#675cff,#a34dff)
    }

    .modal-action.low{
      background:linear-gradient(135deg,#ff7918,#ff4b4b)
    }

    .result{
      display:none;
      text-align:center
    }

    .result.show{
      display:block
    }

    .result-image{
      width:190px;
      height:190px;
      margin:10px auto 16px;
      border-radius:24px;
      overflow:hidden;
      background:#20252d;
      border:1px solid #3a4350
    }

    .result-image img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .result-label{
      color:#8f97a4;
      font-size:13px;
      margin-bottom:5px
    }

    .result-name{
      font-size:27px;
      font-weight:950;
      margin-bottom:18px
    }

    .win-actions{
      display:grid;
      gap:10px;
      margin-top:14px
    }

    .withdraw-btn,
    .sell-btn,
    .again-btn{
      width:100%;
      border:0;
      border-radius:18px;
      padding:16px;
      color:#fff;
      font-size:16px;
      font-weight:900
    }

    .withdraw-btn{
      background:linear-gradient(135deg,#675cff,#a34dff)
    }

    .sell-btn{
      background:linear-gradient(135deg,#f4a11a,#ffcf3d);
      color:#211500
    }

    .again-btn{
      background:#252c36;
      border:1px solid #353e4b
    }

    .status-box{
      margin-top:12px;
      padding:12px;
      border-radius:14px;
      background:#202630;
      color:#b7bec8;
      font-size:13px;
      line-height:1.4;
      display:none
    }

    .status-box.show{
      display:block
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:30px;
      transform:translateX(-50%);
      width:max-content;
      max-width:90%;
      padding:12px 16px;
      border-radius:14px;
      background:#242a34;
      color:#fff;
      font-size:13px;
      font-weight:700;
      text-align:center;
      display:none;
      z-index:20000
    }

    .toast.show{
      display:block
    }

    @media(max-width:390px){
      .cases{
        gap:9px
      }

      .case{
        padding:10px
      }

      .case-art{
        height:145px
      }

      .case-name{
        font-size:16px
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <button id="backBtn" class="back-btn" type="button">
      ← Назад
    </button>

    <div>
      <div class="page-title">Кейсы</div>
      <div class="page-subtitle">
        NFT из @fart2_backpack
      </div>
    </div>
  </div>

  <div id="catalogWarning" class="warning"></div>

  <div class="balances">

    <div class="balance-card">
      <div class="balance-label">
        Telegram Stars
      </div>
      <div id="starsBalance" class="balance-value">
        0
      </div>
    </div>

    <div class="balance-card">
      <div class="balance-label">
        TON
      </div>
      <div id="tonBalance" class="balance-value">
        0
      </div>
    </div>

  </div>

  <div class="hero">

    <div class="hero-title">
      Подарки внутри кейсов
    </div>

    <div id="previewStrip" class="preview-strip">
      <div class="preview-line"></div>
    </div>

    <button
      id="depositBtn"
      class="deposit-btn"
      type="button"
    >
      + Пополнить баланс
    </button>

  </div>

  <div class="section-title">
    Выбери кейс
  </div>

  <div id="cases" class="cases"></div>

</div>


<div id="caseModal" class="modal">

  <div class="sheet">

    <div id="caseContent">

      <div class="sheet-head">

        <div
          id="modalTitle"
          class="sheet-title"
        >
          Кейс
        </div>

        <button
          id="closeModal"
          class="close-btn"
          type="button"
        >
          ✕
        </button>

      </div>

      <div
        id="modalPrice"
        class="sheet-price"
      ></div>

      <div class="drop-heading">
        Что может выпасть
      </div>

      <div
        id="drops"
        class="drops"
      ></div>

      <button
        id="modalAction"
        class="modal-action"
        type="button"
      >
        Пополнить баланс
      </button>

    </div>


    <div
      id="winResult"
      class="result"
    >

      <div class="sheet-head">

        <div class="sheet-title">
          Выпало!
        </div>

        <button
          id="closeResult"
          class="close-btn"
          type="button"
        >
          ✕
        </button>

      </div>

      <div class="result-image">

        <img
          id="resultImage"
          src=""
          alt=""
        >

      </div>

      <div class="result-label">
        Ваш приз
      </div>

      <div
        id="resultName"
        class="result-name"
      ></div>

      <div
        id="resultStatus"
        class="status-box"
      ></div>

      <div class="win-actions">

        <button
          id="withdrawPrize"
          class="withdraw-btn"
          type="button"
        >
          Вывести
        </button>

        <button
          id="sellPrize"
          class="sell-btn"
          type="button"
          style="display:none"
        >
          ⭐ Продать за 15 Stars
        </button>

        <button
          id="playAgain"
          class="again-btn"
          type="button"
        >
          Вернуться к кейсу
        </button>

      </div>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>
(() => {

  const tg =
    window.Telegram?.WebApp ||
    null;

  let userBalance = {
    stars:0,
    ton:0
  };

  let CASES = [];
  let selectedCase = null;
  let currentWin = null;

  try {
    tg?.ready();
    tg?.expand();
    tg?.setHeaderColor("#07090e");
    tg?.setBackgroundColor("#07090e");
  } catch (_) {}


  function showToast(
    message,
    timeout = 3500
  ) {

    const el =
      document.getElementById(
        "toast"
      );

    el.textContent =
      message;

    el.classList.add(
      "show"
    );

    clearTimeout(
      window.toastTimer
    );

    window.toastTimer =
      setTimeout(
        () => {

          el.classList.remove(
            "show"
          );

        },
        timeout
      );

  }


  function parseNumber(value) {

    const n =
      Number(
        String(
          value ?? 0
        ).replace(
          ",",
          "."
        )
      );

    return Number.isFinite(n)
      ? n
      : 0;

  }


  function hasEnough(item) {

    return (
      userBalance.stars >=
      Number(item.stars)
      ||
      userBalance.ton >=
      Number(item.ton)
    );

  }


  function requireInitData() {

    if (!tg?.initData) {

      throw new Error(
        "Откройте мини-приложение внутри Telegram"
      );

    }

    return tg.initData;

  }


  async function post(
    url,
    body
  ) {

    const response =
      await fetch(
        url,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );

    let data = {};

    try {
      data =
        await response.json();
    } catch (_) {}

    if (!response.ok) {

      throw new Error(
        data?.detail ||
        data?.message ||
        `Ошибка ${response.status}`
      );

    }

    return data;

  }


  function giftImage(item) {

    return (
      item?.image_url ||
      "/static/nft-gift.png"
    );

  }


  function safeText(value) {

    return String(
      value ?? ""
    )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

  }


  function setBalances(data) {

    const balances =
      data || {};

    userBalance.stars =
      parseNumber(
        balances.XTR
      );

    userBalance.ton =
      parseNumber(
        balances.TON
      );

    document
      .getElementById(
        "starsBalance"
      )
      .textContent =
        userBalance.stars;

    document
      .getElementById(
        "tonBalance"
      )
      .textContent =
        userBalance.ton;

  }


  function renderPreview() {

    const preview =
      document.getElementById(
        "previewStrip"
      );

    const allItems =
      CASES.flatMap(
        item =>
          Array.isArray(
            item.items
          )
            ? item.items
            : []
      );

    preview.innerHTML =
      '<div class="preview-line"></div>';

    allItems
      .slice(
        0,
        8
      )
      .forEach(
        item => {

          const box =
            document.createElement(
              "div"
            );

          box.className =
            "preview-item";

          const img =
            document.createElement(
              "img"
            );

          img.src =
            giftImage(
              item
            );

          img.alt =
            item.name ||
            "Приз";

          img.onerror =
            () => {

              img.onerror =
                null;

              img.src =
                "/static/nft-gift.png";

            };

          box.appendChild(
            img
          );

          preview.appendChild(
            box
          );

        }
      );

  }


  function casePreviewHtml(items) {

    const preview =
      Array.isArray(
        items
      )
        ? items.slice(
            0,
            3
          )
        : [];

    if (!preview.length) {

      return `
        <div class="case-thumb">
          <img
            src="/static/nft-gift.png"
            alt=""
          >
        </div>
      `;

    }

    return preview
      .map(
        item => `

          <div class="case-thumb">

            <img
              src="${safeText(giftImage(item))}"
              alt=""
              onerror="this.onerror=null;this.src='/static/nft-gift.png'"
            >

          </div>

        `
      )
      .join("");

  }


  function renderCases() {

    const root =
      document.getElementById(
        "cases"
      );

    if (!CASES.length) {

      root.innerHTML =
        `
          <div class="empty">
            В кейсах пока нет доступных призов.
          </div>
        `;

      return;

    }

    root.innerHTML =
      CASES
        .map(
          item => {

            const enough =
              hasEnough(
                item
              );

            return `

              <div
                class="case"
                data-case="${item.id}"
              >

                <div class="case-art">

                  <div class="price-pill">
                    ${item.stars} ⭐
                  </div>

                  <div class="case-thumbs">
                    ${casePreviewHtml(item.items)}
                  </div>

                </div>

                <div class="case-name">
                  ${safeText(item.name)}
                </div>

                <div class="case-price">
                  ${item.stars} Stars /
                  ${Number(item.ton).toFixed(2)} TON
                </div>

                <button
                  type="button"
                  class="case-btn ${enough ? "" : "low"}"
                  data-action="${item.id}"
                >

                  ${
                    enough
                      ? `Крутить за ${item.stars}`
                      : "Пополнить баланс"
                  }

                </button>

              </div>

            `;

          }
        )
        .join("");

    document
      .querySelectorAll(
        "[data-case]"
      )
      .forEach(
        card => {

          card.addEventListener(
            "click",
            event => {

              if (
                event.target.closest(
                  "[data-action]"
                )
              ) {
                return;
              }

              const item =
                CASES.find(
                  x =>
                    Number(x.id) ===
                    Number(
                      card.dataset.case
                    )
                );

              if (item) {
                openCase(
                  item
