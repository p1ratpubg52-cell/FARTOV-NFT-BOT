<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <title>Кейсы — FART2 NFT BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent
    }

    html,body{
      width:100%;
      min-height:100%;
      background:#07090e;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      overflow-x:hidden
    }

    body{
      padding-bottom:env(safe-area-inset-bottom)
    }

    button{
      font-family:inherit;
      touch-action:manipulation
    }

    .app{
      width:100%;
      max-width:720px;
      margin:0 auto;
      padding:calc(18px + env(safe-area-inset-top)) 16px 40px
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:20px
    }

    .back-btn{
      border:1px solid #303846;
      background:#151a22;
      color:#fff;
      border-radius:16px;
      padding:13px 15px;
      font-size:14px;
      font-weight:850
    }

    .page-title{
      font-size:31px;
      font-weight:950;
      letter-spacing:-.8px
    }

    .page-subtitle{
      color:#7d8491;
      font-size:13px;
      margin-top:3px
    }

    .warning{
      display:none;
      margin-bottom:16px;
      border-radius:16px;
      padding:12px 14px;
      background:rgba(255,85,85,.08);
      border:1px solid rgba(255,85,85,.22);
      color:#ffb7b7;
      font-size:12px;
      line-height:1.45
    }

    .warning.show{
      display:block
    }

    .balances{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:18px
    }

    .balance-card{
      border-radius:19px;
      padding:15px;
      background:linear-gradient(145deg,#171c25,#10141a);
      border:1px solid #303846
    }

    .balance-label{
      color:#8d95a3;
      font-size:12px;
      margin-bottom:5px
    }

    .balance-value{
      font-size:22px;
      font-weight:900
    }

    .hero{
      border-radius:26px;
      padding:18px;
      margin-bottom:24px;
      border:1px solid #353d49;
      background:
        radial-gradient(circle at 85% 10%,rgba(149,80,255,.26),transparent 33%),
        linear-gradient(145deg,#1d212a,#12161c)
    }

    .hero-title{
      font-size:21px;
      font-weight:900;
      margin-bottom:13px
    }

    .preview-strip{
      position:relative;
      height:112px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px;
      overflow:hidden;
      border-radius:20px;
      background:#242832;
      border:1px solid rgba(255,255,255,.06)
    }

    .preview-item{
      flex:0 0 82px;
      width:82px;
      height:82px;
      border-radius:16px;
      overflow:hidden;
      background:#161a22;
      border:1px solid #3b4350
    }

    .preview-item img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .roulette-track{
      display:flex;
      align-items:center;
      gap:8px;
      will-change:transform;
      transition:transform 4.2s cubic-bezier(.08,.72,.12,1);
    }

    .preview-item.failure{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;
      text-align:center;
      font-size:12px;
      line-height:1.15;
      font-weight:950;
      color:#ff7a7a;
      background:linear-gradient(145deg,#2b171c,#161a22);
      border-color:#7b333e
    }

    .case.selected{
      border-color:#8d69ff;
      box-shadow:0 0 0 2px rgba(141,105,255,.18),0 0 28px rgba(141,105,255,.13)
    }

    .preview-line{
      position:absolute;
      top:0;
      bottom:0;
      left:50%;
      width:4px;
      transform:translateX(-50%);
      background:#8d69ff;
      box-shadow:0 0 16px rgba(141,105,255,.7);
      z-index:5
    }

    .deposit-btn{
      width:100%;
      margin-top:14px;
      border:0;
      border-radius:18px;
      padding:16px;
      color:#fff;
      font-size:16px;
      font-weight:900;
      background:linear-gradient(135deg,#675cff,#a34dff)
    }

    .section-title{
      font-size:22px;
      font-weight:950;
      margin:0 2px 14px
    }

    .cases{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px
    }

    .case{
      border-radius:25px;
      border:1px solid #313946;
      background:linear-gradient(145deg,#171c24,#11151b);
      padding:12px;
      overflow:hidden
    }

    .case:active{
      transform:scale(.985)
    }

    .case-art{
      position:relative;
      height:160px;
      margin-bottom:12px;
      border-radius:19px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:2px solid rgba(220,169,46,.75);
      background:
        radial-gradient(circle at 50% 35%,rgba(255,255,255,.13),transparent 25%),
        linear-gradient(180deg,#30343d,#23262e)
    }

    .case-thumbs{
      position:relative;
      width:115px;
      height:105px
    }

    .case-thumb{
      position:absolute;
      width:70px;
      height:70px;
      border-radius:15px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.16);
      box-shadow:0 8px 20px rgba(0,0,0,.32);
      background:#151922
    }

    .case-thumb img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .case-thumb:nth-child(1){
      left:0;
      bottom:0;
      transform:rotate(-8deg)
    }

    .case-thumb:nth-child(2){
      right:0;
      bottom:0;
      transform:rotate(8deg)
    }

    .case-thumb:nth-child(3){
      left:23px;
      top:0;
      z-index:3
    }

    .price-pill{
      position:absolute;
      top:10px;
      right:10px;
      z-index:6;
      background:#101217;
      border-radius:13px;
      padding:8px 11px;
      font-size:13px;
      font-weight:900
    }

    .case-name{
      font-size:18px;
      font-weight:900;
      margin-bottom:6px
    }

    .case-price{
      color:#969eaa;
      font-size:13px;
      line-height:1.35;
      min-height:38px;
      margin-bottom:10px
    }

    .case-btn{
      width:100%;
      border:0;
      border-radius:16px;
      padding:13px 8px;
      font-size:13px;
      font-weight:900;
      color:#fff;
      background:linear-gradient(135deg,#675cff,#a34dff)
    }

    .case-btn.low{
      background:linear-gradient(135deg,#ff7918,#ff4b4b)
    }

    .empty{
      grid-column:1/-1;
      border-radius:20px;
      padding:24px 16px;
      background:#151a22;
      border:1px solid #303846;
      color:#9098a5;
      font-size:14px;
      line-height:1.45;
      text-align:center
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      justify-content:center;
      align-items:flex-end;
      background:rgba(0,0,0,.80);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px)
    }

    .modal.active{
      display:flex
    }

    .sheet{
      width:100%;
      max-width:720px;
      max-height:90vh;
      overflow-y:auto;
      background:#11161e;
      border-radius:30px 30px 0 0;
      border:1px solid #303846;
      padding:19px 16px calc(25px + env(safe-area-inset-bottom))
    }

    .sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px
    }

    .sheet-title{
      font-size:25px;
      font-weight:950
    }

    .close-btn{
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      background:#292f39;
      color:#fff;
      font-size:20px
    }

    .sheet-price{
      color:#9ba3af;
      font-size:14px;
      margin-bottom:18px
    }

    .drop-heading{
      font-size:19px;
      font-weight:900;
      margin-bottom:12px
    }

    .drops{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:18px
    }

    .drop{
      border-radius:19px;
      overflow:hidden;
      background:linear-gradient(145deg,#1b2029,#131820);
      border:1px solid #343c49;
      padding:10px
    }

    .drop-image{
      width:100%;
      aspect-ratio:1/1;
      overflow:hidden;
      border-radius:15px;
      background:#222731;
      margin-bottom:9px
    }

    .drop-image img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .drop-name{
      font-size:13px;
      font-weight:850;
      line-height:1.3;
      min-height:34px
    }

    .drop-chance{
      color:#929aa7;
      font-size:11px;
      margin-top:5px
    }

    .drop-link{
      display:block;
      color:#8978ff;
      font-size:11px;
      margin-top:5px;
      text-decoration:none
    }

    .modal-action{
      width:100%;
      border:0;
      border-radius:18px;
      padding:16px;
      color:#fff;
      font-size:16px;
      font-weight:900;
      background:linear-gradient(135deg,#675cff,#a34dff)
    }

    .modal-action.low{
      background:linear-gradient(135deg,#ff7918,#ff4b4b)
    }

    .result{
      display:none;
      text-align:center
    }

    .result.show{
      display:block
    }

    .result-image{
      width:190px;
      height:190px;
      margin:10px auto 16px;
      border-radius:24px;
      overflow:hidden;
      background:#20252d;
      border:1px solid #3a4350
    }

    .result-image img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block
    }

    .result-label{
      color:#8f97a4;
      font-size:13px;
      margin-bottom:5px
    }

    .result-name{
      font-size:27px;
      font-weight:950;
      margin-bottom:18px
    }

    .win-actions{
      display:grid;
      gap:10px;
      margin-top:14px
    }

    .withdraw-btn,
    .sell-btn,
    .again-btn{
      width:100%;
      border:0;
      border-radius:18px;
      padding:16px;
      color:#fff;
      font-size:15px;
      font-weight:900
    }

    .withdraw-btn{
      background:linear-gradient(135deg,#665cff,#a34dff)
    }

    .sell-btn{
      background:linear-gradient(135deg,#1f8bff,#695aff)
    }

    .again-btn{
      background:#262d37
    }

    .result-status{
      display:none;
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      background:#1c222c;
      color:#b7c0cd;
      font-size:13px;
      line-height:1.4
    }

    .result-status.show{
      display:block
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(22px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(120px);
      z-index:10000;
      width:calc(100% - 30px);
      max-width:500px;
      padding:13px 16px;
      border-radius:17px;
      background:#222832;
      color:#fff;
      text-align:center;
      font-size:13px;
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.25s ease;
      border:1px solid #394250
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0)
    }

    @media(max-width:390px){
      .app{
        padding-left:11px;
        padding-right:11px
      }

      .cases{
        gap:9px
      }

      .case{
        padding:9px
      }

      .case-art{
        height:145px
      }

      .case-name{
        font-size:16px
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <button class="back-btn" id="backBtn">
      ← Назад
    </button>

    <div>
      <div class="page-title">
        Кейсы
      </div>

      <div class="page-subtitle">
        NFT из @fart2_backpack
      </div>
    </div>
  </div>

  <div class="warning" id="catalogWarning"></div>

  <div class="balances">
    <div class="balance-card">
      <div class="balance-label">
        Telegram Stars
      </div>

      <div class="balance-value" id="starsBalance">
        0
      </div>
    </div>

    <div class="balance-card">
      <div class="balance-label">
        TON
      </div>

      <div class="balance-value" id="tonBalance">
        0
      </div>
    </div>
  </div>

  <section class="hero">
    <div class="hero-title">
      Подарки внутри кейсов
    </div>

    <div class="preview-strip" id="previewStrip">
      <div class="roulette-track" id="rouletteTrack"></div>
      <div class="preview-line"></div>
    </div>

    <button class="deposit-btn" id="depositBtn">
      + Пополнить баланс
    </button>
  </section>

  <div class="section-title">
    Выбери кейс
  </div>

  <div class="cases" id="casesList"></div>
</div>

<div class="modal" id="caseModal">
  <div class="sheet">

    <div id="caseContent">

      <div class="sheet-head">
        <div class="sheet-title" id="modalTitle">
          Кейс
        </div>

        <button class="close-btn" id="closeModal">
          ×
        </button>
      </div>

      <div class="sheet-price" id="modalPrice"></div>

      <div class="drop-heading">
        Что может выпасть
      </div>

      <div class="drops" id="drops"></div>

      <button class="modal-action" id="modalAction">
        Крутить
      </button>
    </div>

    <div class="result" id="winResult">

      <div class="sheet-head">
        <div class="sheet-title">
          Результат
        </div>

        <button class="close-btn" id="closeResult">
          ×
        </button>
      </div>

      <div class="result-image">
        <img id="resultImage" src="" alt="">
      </div>

      <div class="result-label">
        Выпало
      </div>

      <div class="result-name" id="resultName">
        Приз
      </div>

      <div class="win-actions">
        <button class="withdraw-btn" id="withdrawPrize">
          Вывести NFT
        </button>

        <button class="sell-btn" id="sellPrize">
          Продать
        </button>

        <button class="again-btn" id="playAgain">
          Крутить ещё
        </button>
      </div>

      <div class="result-status" id="resultStatus"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {

  const tg = window.Telegram?.WebApp || null;

  try{
    tg?.ready();
    tg?.expand();
  }catch(_){}

  let CASES = [];
  let selectedCase = null;
  let currentWin = null;
  let rouletteBusy = false;

  let BALANCES = {
    XTR:0,
    TON:0
  };

  function safeText(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function requireInitData(){
    const initData = tg?.initData || "";

    if(!initData){
      throw new Error(
        "Открой мини-приложение через Telegram."
      );
    }

    return initData;
  }

  async function post(url, body){
    const response = await fetch(
      url,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      }
    );

    let data = null;

    try{
      data = await response.json();
    }catch(_){}

    if(!response.ok){
      throw new Error(
        data?.detail ||
        data?.message ||
        "Ошибка сервера"
      );
    }

    return data;
  }

  function showToast(text, timeout=3000){
    const toast = document.getElementById("toast");

    toast.textContent = String(text || "");
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(
      () => {
        toast.classList.remove("show");
      },
      timeout
    );
  }

  function normalizeBalanceValue(value){
    const number = Number(value || 0);

    if(!Number.isFinite(number)){
      return 0;
    }

    return number;
  }

  function setBalances(balances){
    BALANCES.XTR = normalizeBalanceValue(
      balances?.XTR ??
      balances?.stars ??
      balances?.telegram_stars ??
      0
    );

    BALANCES.TON = normalizeBalanceValue(
      balances?.TON ??
      balances?.ton ??
      0
    );

    document.getElementById(
      "starsBalance"
    ).textContent = BALANCES.XTR;

    document.getElementById(
      "tonBalance"
    ).textContent = BALANCES.TON;

    updateHeroAction();
  }

  function giftImage(item){
    return (
      item?.image_url ||
      item?.image ||
      item?.gift_image ||
      "/static/nft-gift.png"
    );
  }

  function isFailure(item){
    return Boolean(item?.is_failure);
  }

  function hasEnoughStars(item){
    return (
      BALANCES.XTR >=
      Number(item?.stars || 0)
    );
  }

  function hasEnough(item){
    const stars = Number(
      item?.stars || 0
    );

    const ton = Number(
      item?.ton || 0
    );

    return (
      BALANCES.XTR >= stars ||
      BALANCES.TON >= ton
    );
  }

  function rouletteItemHtml(gift){

    if(isFailure(gift)){
      return `
        <div class="preview-item failure">
          НЕУДАЧА
        </div>
      `;
    }

    return `
      <div class="preview-item">
        <img
          src="${safeText(giftImage(gift))}"
          alt=""
          onerror="this.onerror=null;this.src='/static/nft-gift.png'"
        >
      </div>
    `;
  }

  function getPreviewItems(item){
    const items = Array.isArray(item?.items)
      ? item.items
      : [];

    if(!items.length){
      return [];
    }

    const result = [];

    for(let repeat = 0; repeat < 4; repeat++){
      for(const gift of items){
        result.push(gift);
      }
    }

    return result;
  }

  function renderPreview(item = selectedCase){
    const track = document.getElementById(
      "rouletteTrack"
    );

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";

    const items = getPreviewItems(item);

    if(!items.length){
      track.innerHTML = `
        <div
          style="
            color:#8f97a4;
            font-size:13px;
            padding:20px;
          "
        >
          Выберите кейс
        </div>
      `;
      return;
    }

    track.innerHTML = items
      .map(rouletteItemHtml)
      .join("");
  }

  function updateHeroAction(){
    const button = document.getElementById(
      "depositBtn"
    );

    if(!selectedCase){
      button.textContent =
        "+ Пополнить баланс";
      return;
    }

    if(hasEnoughStars(selectedCase)){
      button.textContent =
        `Крутить за ${Number(selectedCase.stars)} ⭐`;
    }else{
      button.textContent =
        "+ Пополнить баланс";
    }
  }

  function getCaseThumbs(item){
    const gifts = (
      Array.isArray(item?.items)
        ? item.items
        : []
    )
    .filter(
      gift => !isFailure(gift)
    )
    .slice(0,3);

    if(!gifts.length){
      return `
        <div
          style="
            color:#9da5b2;
            font-size:12px;
            text-align:center;
          "
        >
          NFT
        </div>
      `;
    }

    return `
      <div class="case-thumbs">
        ${
          gifts.map(
            gift => `
              <div class="case-thumb">
                <img
                  src="${safeText(giftImage(gift))}"
                  alt=""
                  onerror="this.onerror=null;this.src='/static/nft-gift.png'"
                >
              </div>
            `
          ).join("")
        }
      </div>
    `;
  }

  function renderCases(){
    const list = document.getElementById(
      "casesList"
    );

    if(!CASES.length){
      list.innerHTML = `
        <div class="empty">
          Кейсы пока не загружены.
        </div>
      `;
      return;
    }

    list.innerHTML = CASES
      .map(
        item => {

          const selected =
            selectedCase &&
            Number(selectedCase.id) ===
            Number(item.id);

          return `
            <div
              class="case ${selected ? "selected" : ""}"
              data-case="${Number(item.id)}"
            >

              <div class="case-art">
                <div class="price-pill">
                  ${Number(item.stars)} ⭐
                </div>

                ${getCaseThumbs(item)}
              </div>

              <div class="case-name">
                ${safeText(item.name || "Кейс")}
              </div>

              <div class="case-price">
                ${Number(item.stars)} Stars /
                ${Number(item.ton || 0).toFixed(2)} TON
              </div>

              <button
                class="case-btn"
                data-select-case="${Number(item.id)}"
              >
                ${
                  selected
                    ? "✓ Выбрано"
                    : "Выбрать"
                }
              </button>

            </div>
          `;
        }
      )
      .join("");

    document
      .querySelectorAll("[data-select-case]")
      .forEach(
        button => {
          button.addEventListener(
            "click",
            event => {

              event.stopPropagation();

              const id = Number(
                button.dataset.selectCase
              );

              const item = CASES.find(
                caseItem =>
                  Number(caseItem.id) === id
              );

              if(!item){
                return;
              }

              selectedCase = item;

              renderPreview(selectedCase);
              renderCases();
              updateHeroAction();

              try{
                tg?.HapticFeedback
                  ?.impactOccurred("light");
              }catch(_){}
            }
          );
        }
      );
  }

  function openCaseDetails(item){
    selectedCase = item;
    currentWin = null;

    document.getElementById(
      "caseContent"
    ).style.display = "block";

    document.getElementById(
      "winResult"
    ).classList.remove("show");

    document.getElementById(
      "modalTitle"
    ).textContent = item.name;

    document.getElementById(
      "modalPrice"
    ).textContent =
      `${item.stars} Stars / ${Number(item.ton).toFixed(2)} TON`;

    const drops = document.getElementById(
      "drops"
    );

    if(
      !Array.isArray(item.items) ||
      !item.items.length
    ){
      drops.innerHTML = `
        <div class="empty">
          В этом кейсе пока нет доступных призов.
        </div>
      `;
    }else{
      drops.innerHTML = item.items
        .map(
          gift => {

            const chance = Number(
              gift.chance_percent || 0
            );

            if(isFailure(gift)){
              return `
                <div class="drop">

                  <div class="drop-image">
                    <div
                      style="
                        width:100%;
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-weight:950;
                        color:#ff7777;
                      "
                    >
                      НЕУДАЧА
                    </div>
                  </div>

                  <div class="drop-name">
                    Неудача
                  </div>

                  <div class="drop-chance">
                    Шанс: ${chance}%
                  </div>

                </div>
              `;
            }

            return `
              <div class="drop">
                <div class="drop-image">
                  <img
                    src="${safeText(giftImage(gift))}"
                    alt=""
                    onerror="this.onerror=null;this.src='/static/nft-gift.png'"
                  >
                </div>

                <div class="drop-name">
                  ${safeText(gift.name || "Приз")}
                </div>

                <div class="drop-chance">
                  Шанс: ${chance}%
                </div>

                ${
                  gift.gift_url
                    ? `
                      <a
                        class="drop-link"
                        href="${safeText(gift.gift_url)}"
                        target="_blank"
                      >
                        Посмотреть NFT
                      </a>
                    `
                    : ""
                }
              </div>
            `;
          }
        )
        .join("");
    }

    const action = document.getElementById(
      "modalAction"
    );

    if(hasEnough(item)){
      action.classList.remove("low");
      action.textContent =
        `Крутить за ${item.stars}`;
    }else{
      action.classList.add("low");
      action.textContent =
        "Пополнить баланс";
    }

    document.getElementById(
      "caseModal"
    ).classList.add("active");
  }
