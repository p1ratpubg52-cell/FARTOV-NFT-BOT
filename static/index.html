<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>FART2 NFT BOT</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #05070b;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        30px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #8f939d;
      margin-top: 3px;
      font-size: 17px;
    }

    .wallet-top {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo {
      width: 92px;
      height: 92px;
      min-width: 92px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 42px;
      font-weight: 900;

      background: linear-gradient(
        145deg,
        #43d7ff,
        #6b79ff,
        #9b39ff
      );

      border: 5px solid #723eff;

      box-shadow:
        0 0 28px rgba(101, 76, 255, 0.35);
    }

    .wallet-info {
      flex: 1;
      min-width: 0;
    }

    .balance-label {
      color: #9b9faa;
      font-size: 19px;
      margin-bottom: 5px;
    }

    .main-balance {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 34px;
      font-weight: 900;
    }

    .main-balance .unit {
      color: #c6c8ce;
      font-size: 17px;
      font-weight: 700;
    }

    .deposit-main {
      flex-shrink: 0;

      border: none;

      color: white;

      background: linear-gradient(
        135deg,
        #7652ff,
        #9e58ff
      );

      border-radius: 22px;

      padding: 18px 20px;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      position: relative;
      z-index: 10;
    }

    .deposit-main:active {
      transform: scale(0.97);
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;

      font-weight: 700;
      margin-bottom: 12px;
    }

    .live-dot {
      width: 13px;
      height: 13px;
      background: #21dd97;
      border-radius: 50%;

      box-shadow:
        0 0 14px rgba(33, 221, 151, 0.8);
    }

    .quick-menu {
      display: flex;
      gap: 13px;

      overflow-x: auto;

      padding-bottom: 24px;

      scrollbar-width: none;
    }

    .quick-menu::-webkit-scrollbar {
      display: none;
    }

    .quick-btn {
      min-width: 100px;
      height: 100px;

      border-radius: 25px;

      border: 1px solid #303642;

      background: linear-gradient(
        180deg,
        #191f2a,
        #11151c
      );

      font-size: 36px;

      cursor: pointer;

      color: white;

      position: relative;
      z-index: 10;
    }

    .quick-btn:active {
      transform: scale(0.95);
    }

    .card {
      position: relative;

      width: 100%;

      min-height: 205px;

      margin-bottom: 26px;

      padding: 30px;

      border: none;
      border-radius: 34px;

      color: white;

      text-align: left;

      overflow: hidden;

      cursor: pointer;

      z-index: 5;
    }

    .card:active {
      transform: scale(0.985);
    }

    .blue {
      background: linear-gradient(
        135deg,
        #55bfff,
        #5b68ed
      );
    }

    .orange {
      background: linear-gradient(
        135deg,
        #ffb219,
        #ff8800
      );
    }

    .purple {
      background: linear-gradient(
        135deg,
        #9c12ff,
        #5a26ce
      );
    }

    .badge {
      display: inline-block;

      background: white;
      color: #5871d0;

      border-radius: 16px;

      padding: 9px 15px;

      font-weight: 900;
      font-size: 16px;
    }

    .card-title {
      margin-top: 27px;

      font-size: 37px;
      line-height: 1;

      font-weight: 900;

      max-width: 82%;
    }

    .card-text {
      margin-top: 12px;

      font-size: 20px;
      font-weight: 700;

      max-width: 72%;

      line-height: 1.25;
    }

    .card-icon {
      position: absolute;

      right: 22px;
      bottom: 23px;

      font-size: 78px;

      filter:
        drop-shadow(
          0 10px 8px rgba(0,0,0,0.25)
        );
    }

    /* MODAL */

    .modal {
      position: fixed;

      inset: 0;

      display: none;

      justify-content: center;
      align-items: flex-end;

      background: rgba(0,0,0,0.72);

      z-index: 99999;

      pointer-events: none;
    }

    .modal.active {
      display: flex;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 720px;

      max-height: 85vh;

      overflow-y: auto;

      background: #12161e;

      border-radius: 30px 30px 0 0;

      padding:
        24px
        18px
        calc(26px + env(safe-area-inset-bottom));

      border: 1px solid #282e38;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .sheet-title {
      font-size: 27px;
      font-weight: 850;
    }

    .close-btn {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      border: none;

      color: white;
      background: #262c36;

      font-size: 20px;

      cursor: pointer;
    }

    .payment-btn {
      width: 100%;

      margin-bottom: 11px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      border: 1px solid #343a46;

      border-radius: 20px;

      background: #1a1f28;

      padding: 17px 18px;

      color: white;

      cursor: pointer;
    }

    .payment-btn:active {
      transform: scale(0.985);
    }

    .payment-left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .payment-icon {
      font-size: 31px;
    }

    .payment-name {
      font-size: 19px;
      font-weight: 800;
      text-align: left;
    }

    .payment-description {
      display: block;

      font-size: 13px;

      color: #9ca2ad;

      font-weight: 500;

      margin-top: 3px;
    }

    .arrow {
      font-size: 27px;
      color: #a8acb5;
    }

    .balances {
      display: grid;
      gap: 11px;
    }

    .balance-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      border-radius: 20px;

      background: #1a1f28;

      border: 1px solid #343a46;

      padding: 18px;
    }

    .balance-left {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 19px;
      font-weight: 800;
    }

    .balance-number {
      font-size: 20px;
      font-weight: 900;
    }

    .status {
      text-align: center;

      margin-top: 15px;

      color: #a4a9b3;

      font-size: 13px;

      line-height: 1.4;
    }

    .toast {
      position: fixed;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      width: max-content;
      max-width: 90%;

      padding: 13px 17px;

      border-radius: 14px;

      background: #242a34;

      color: white;

      font-size: 15px;
      font-weight: 600;

      text-align: center;

      display: none;

      z-index: 200000;
    }

    .toast.show {
      display: block;
    }

    .loader {
      width: 18px;
      height: 18px;

      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: white;

      border-radius: 50%;

      animation: rotate 0.7s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {
      .app {
        padding-left: 15px;
        padding-right: 15px;
      }

      .logo {
        width: 82px;
        height: 82px;
        min-width: 82px;
      }

      .balance-label {
        font-size: 16px;
      }

      .main-balance {
        font-size: 31px;
      }

      .deposit-main {
        padding: 16px 16px;
        font-size: 17px;
      }

      .card {
        min-height: 190px;
        padding: 27px 23px;
      }

      .card-title {
        font-size: 31px;
      }

      .card-text {
        font-size: 18px;
      }

      .card-icon {
        font-size: 65px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="title">FART2 NFT BOT</div>
    <div class="subtitle">мини-приложение</div>
  </header>


  <section class="wallet-top">

    <div class="logo">

    </div>

    <div class="wallet-info">

  <div class="quick-menu">

    <button

    <button

    <button

  <button

    <span class="badge">

  <button

  >

    <span class="badge">

    <div class="card-title">

    <div class="card-text">

    </div>

</div>



<!-- ПОПОЛНЕНИЕ -->

>

  <div class="sheet">

  id="walletModal"
  class="modal"
>

  <div class="sheet">

    <div class="sheet-header">

      <div class="sheet-title">
        Ваш баланс

    <div class="balances">

<div
  id="toast"
  class="toast"
></div>



<script>

(() => {

  /* ================================
     TELEGRAM
  ================================= */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  if (tg) {

    try {

      tg.ready();

      tg.expand();

      tg.setHeaderColor("#05070b");

      tg.setBackgroundColor("#05070b");

    } catch (error) {

      console.log(
        "Telegram init:",
        error
      );

    }

  }



  /* ================================
     HELPERS
  ================================= */

  function showToast(message) {

    const toast =
      document.getElementById("toast");

    toast.textContent =
      message;

    toast.classList.add("show");


    clearTimeout(
      window.toastTimer
    );


    window.toastTimer =
      setTimeout(() => {

        toast.classList.remove(
          "show"
        );

      }, 2500);

  }



  function haptic() {

    try {

      tg?.HapticFeedback
        ?.impactOccurred("light");

    } catch (_) {}

  }



  function openModal(id) {

    const modal =
      document.getElementById(id);

    if (!modal) return;

    modal.classList.add(
      "active"
    );

    haptic();

  }



  function closeModal(id) {

    const modal =
      document.getElementById(id);

    if (!modal) return;

    modal.classList.remove(
      "active"
    );

  }



  function telegramUser() {

    try {

      return (
        tg?.initDataUnsafe?.user ||
        null
      );

    } catch (_) {

      return null;

    }

  }



  function getTelegramId() {

    const user =
      telegramUser();

    return user?.id || null;

  }



  /* ================================
     API
  ================================= */

  async function api(
    url,
    options = {}
  ) {

    const headers = {
      "Content-Type":
        "application/json",

      ...(options.headers || {})
    };


    if (tg?.initData) {

      headers[
        "X-Telegram-Init-Data"
      ] = tg.initData;

    }


    const response =
      await fetch(
        url,
        {
          ...options,
          headers
        }
      );


    let data = {};

    try {

      data =
        await response.json();

    } catch (_) {}


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Ошибка сервера"
      );

    }


    return data;

  }



  /* ================================
     BALANCE
  ================================= */

  function setBalances(data) {

    const ton =
      Number(
        data?.ton ?? 0
      );


    const stars =
      Number(
        data?.stars ?? 0
      );


    const usdt =
      Number(
        data?.usdt ?? 0
      );


    const gram =
      Number(
        data?.gram ?? 0
      );


    document.getElementById(
      "topTonBalance"
    ).textContent =
      ton;


    document.getElementById(
      "tonBalance"
    ).textContent =
      ton;


    document.getElementById(
      "starsBalance"
    ).textContent =
      stars;


    document.getElementById(
      "usdtBalance"
    ).textContent =
      usdt;


    document.getElementById(
      "gramBalance"
    ).textContent =
      gram;

  }



  async function loadBalance() {

    try {

      const telegramId =
        getTelegramId();


      const query =
        telegramId
          ? `?telegram_id=${telegramId}`
          : "";


      const data =
        await api(
          `/api/balance${query}`
        );


      setBalances(
        data
      );

    } catch (error) {

      console.log(
        "Balance API пока не подключён:",
        error.message
      );

    }

  }



  /* ================================
     PAYMENT
  ================================= */

  async function startDeposit(
    currency,
    button
  ) {

    haptic();


    const oldHTML =
      button.innerHTML;


    button.disabled =
      true;


    try {

      const data =
        await api(
          `/api/deposit/${currency}`,
          {

            method: "POST",

            body: JSON.stringify({

              telegram_id:
                getTelegramId(),

              initData:
                tg?.initData || ""

            })

          }
        );


      /*
        STARS

        Backend может вернуть:

        {
          "invoice_link":
          "https://t.me/$..."
        }
      */

      if (
        currency === "stars" &&
        data.invoice_link
      ) {

        if (
          tg &&
          typeof tg.openInvoice ===
            "function"
        ) {

          tg.openInvoice(
            data.invoice_link,
            status => {

              if (
                status === "paid"
              ) {

                showToast(
                  "Оплата прошла успешно"
                );

                loadBalance();

              }

            }
          );

          return;

        }

      }



      /*
        TON / USDT / GRAM

        Backend может вернуть:

        {
          "url":
          "ton://transfer/..."
        }
      */

      const paymentUrl =
        data.url ||
        data.payment_url ||
        data.pay_url;


      if (paymentUrl) {

        if (tg?.openLink) {

          tg.openLink(
            paymentUrl
          );

        } else {

          window.location.href =
            paymentUrl;

        }

        return;

      }



      /*
        Альтернативный вариант:

        backend вернул адрес кошелька
      */

      if (data.address) {

        await navigator.clipboard
          ?.writeText(
            data.address
          );


        showToast(
          "Адрес кошелька скопирован"
        );

        return;

      }


      showToast(
        "Сервер не вернул ссылку для оплаты"
      );


    } catch (error) {

      console.error(
        error
      );


      showToast(
        "Платёжный сервер ещё не подключён"
      );

    } finally {

      button.disabled =
        false;

      button.innerHTML =
        oldHTML;

    }

  }



  /* ================================
     MAIN DEPOSIT BUTTON
  ================================= */

  document
    .getElementById(
      "openDeposit"
    )
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        event.stopPropagation();

        openModal(
          "depositModal"
        );

      }
    );



  /* ================================
     CLOSE MODALS
  ================================= */

  document
    .querySelectorAll(
      "[data-close]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();

          closeModal(
            button.dataset.close
          );

        }
      );

    });



  document
    .querySelectorAll(
      ".modal"
    )
    .forEach(modal => {

      modal.addEventListener(
        "click",
        event => {

          if (
            event.target === modal
          ) {

            closeModal(
              modal.id
            );

          }

        }
      );

    });



  /* ================================
     PAYMENT BUTTONS
  ================================= */

  document
    .querySelectorAll(
      "[data-deposit]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();


          const currency =
            button.dataset.deposit;


          startDeposit(
            currency,
            button
          );

        }
      );

    });



  /* ================================
     MAIN SECTIONS
  ================================= */

  document
    .querySelectorAll(
      "[data-section]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();


          const section =
            button.dataset.section;


          haptic();


          switch (
            section
          ) {

            case "wallet":

              openModal(
                "walletModal"
              );

              loadBalance();

              break;


            case "stars":

              openModal(
                "depositModal"
              );

              break;


            case "gift":

              showToast(
                "Раздел подарков"
              );

              break;


            case "nft":

              showToast(
                "Раздел NFT"
              );

              break;


            case "upgrade":

              showToast(
                "Upgrade NFT"
              );

              break;


            case "live":

              showToast(
                "Live"
              );

              break;

          }

        }
      );

    });



  /* ================================
     FIX FOR INVISIBLE OVERLAYS
  ================================= */

  document.documentElement.style
    .pointerEvents =
      "auto";


  document.body.style
    .pointerEvents =
      "auto";



  /* ================================
     INITIAL LOAD
  ================================= */

  loadBalance();


})();

</script>

</body>
</html>
