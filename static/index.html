<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>FARTOV NFT</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#090a0d;
  --card:#15171c;
  --line:#292d37;
  --muted:#969dab;
  --accent:#7657ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:18px 16px 98px;
}

.brand{
  font-size:28px;
  font-weight:900;
  margin:4px 0 18px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
}

.title{
  font-size:20px;
  font-weight:800;
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
}

.big{
  font-size:34px;
  font-weight:900;
}

.deposit{
  font-size:22px;
  font-weight:900;
  margin:12px 0;
}

select,
input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#0e1014;
  color:#fff;
  font-size:16px;
  margin-top:10px;
}

button,
a.btn{
  display:block;
  width:100%;
  margin-top:10px;
  padding:14px;
  border:0;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  text-align:center;
  font-weight:800;
  font-size:16px;
}

.secondary{
  background:#22262e !important;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.tabs{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#0b0c10;
  border-top:1px solid var(--line);
  display:flex;
}

.tab{
  flex:1;
  padding:15px 4px;
  text-align:center;
  color:#9299a7;
  font-size:13px;
}

.tab.active{
  color:#fff;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-top:1px solid var(--line);
}

.approved{
  color:#38d69f;
}

.wheelWrap{
  display:flex;
  justify-content:center;
  margin:18px 0 10px;
  position:relative;
}

.pointer{
  position:absolute;
  top:-2px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-top:28px solid #ffd54a;
  z-index:3;
}

#wheel{
  width:310px;
  height:310px;
  border-radius:50%;
  border:12px solid #2b3442;
  transition:transform 3.6s cubic-bezier(.12,.72,.17,1);
}

.odds{
  text-align:center;
  font-weight:900;
  font-size:28px;
  margin-top:10px;
}

.result{
  text-align:center;
  font-size:18px;
  font-weight:800;
  margin-top:14px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    FARTOV NFT
  </div>

  <section id="home" class="screen active">

    <div class="card">

      <div
      class="title"
      id="userName">
        Загрузка…
      </div>

      <div
      class="big"
      id="count">
        0
      </div>

      <div class="muted">
        подарков в профиле
      </div>

    </div>

  </section>


  <section id="upgrade" class="screen">

    <div class="card">

      <div class="title">
        Upgrade
      </div>

      <div class="muted">
        Выбери подарок из своего профиля:
      </div>

      <select id="sourceGift">

        <option value="">
          Нет доступных подарков
        </option>

      </select>


      <div
      class="muted"
      style="margin-top:14px">
        Выбери цель:
      </div>


      <select id="targetGift">

        <option value="1.5">
          Target ×1.5 — шанс 62%
        </option>

        <option value="2">
          Target ×2 — шанс 46%
        </option>

        <option value="3">
          Target ×3 — шанс 29%
        </option>

        <option value="5">
          Target ×5 — шанс 16%
        </option>

      </select>


      <div class="wheelWrap">

        <div class="pointer"></div>

        <canvas
        id="wheel"
        width="620"
        height="620">
        </canvas>

      </div>


      <div
      class="odds"
      id="odds">
        62%
      </div>


      <button
      id="spinBtn"
      onclick="spin()">
        Крутить
      </button>


      <div
      id="result"
      class="result">
      </div>

    </div>

  </section>


  <section id="deposit" class="screen">

    <div class="card">

      <div class="title">
        Внести подарок
      </div>


      <div class="muted">
        1. Отправь collectible gift на:
      </div>


      <div
      class="deposit"
      id="depUser">
        @fart2_backpack
      </div>


      <a
      class="btn secondary"
      id="depLink"
      href="https://t.me/fart2_backpack">
        Открыть аккаунт
      </a>


      <div
      class="muted"
      style="margin-top:16px">
        2. Вставь публичную ссылку подарка:
      </div>


      <input
      id="giftUrl"
      placeholder="https://t.me/nft/...">


      <button onclick="sendDep()">
        Отправить на проверку
      </button>


      <div
      id="msg"
      class="muted"
      style="margin-top:10px">
      </div>

    </div>

  </section>


  <section
  id="inventory"
  class="screen">

    <div class="card">

      <div class="title">
        Мои подарки
      </div>

      <div
      id="items"
      class="muted">
        Пока нет подарков.
      </div>

    </div>

  </section>

</div>


<div class="tabs">

  <div
  class="tab active"
  onclick="showTab('home',this)">
    Главная
  </div>

  <div
  class="tab"
  onclick="showTab('upgrade',this)">
    Upgrade
  </div>

  <div
  class="tab"
  onclick="showTab('deposit',this)">
    Депозит
  </div>

  <div
  class="tab"
  onclick="showTab('inventory',this)">
    Подарки
  </div>

</div>


<script>

const tg = Telegram.WebApp;

tg.ready();
tg.expand();

let deposits = [];
let rotation = 0;

const oddsMap = {
  "1.5":62,
  "2":46,
  "3":29,
  "5":16
};


function showTab(id,element){

  document
  .querySelectorAll('.screen')
  .forEach(
    x => x.classList.remove('active')
  );

  document
  .querySelectorAll('.tab')
  .forEach(
    x => x.classList.remove('active')
  );

  document
  .getElementById(id)
  .classList.add('active');

  if(element){
    element.classList.add('active');
  }

}


function drawWheel(percent){

  const canvas =
  document.getElementById('wheel');

  const ctx =
  canvas.getContext('2d');

  const cx =
  canvas.width / 2;

  const cy =
  canvas.height / 2;

  const radius =
  265;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const start =
  -Math.PI / 2;

  const greenAngle =
  2 * Math.PI * (percent / 100);


  ctx.beginPath();

  ctx.moveTo(
    cx,
    cy
  );

  ctx.arc(
    cx,
    cy,
    radius,
    start,
    start + greenAngle
  );

  ctx.closePath();

  ctx.fillStyle =
  '#19c986';

  ctx.fill();


  ctx.beginPath();

  ctx.moveTo(
    cx,
    cy
  );

  ctx.arc(
    cx,
    cy,
    radius,
    start + greenAngle,
    start + Math.PI * 2
  );

  ctx.closePath();

  ctx.fillStyle =
  '#202733';

  ctx.fill();


  for(
    let i = 0;
    i < 72;
    i++
  ){

    const angle =
    start +
    i * (Math.PI * 2 / 72);

    ctx.beginPath();

    ctx.moveTo(
      cx + Math.cos(angle) * 80,
      cy + Math.sin(angle) * 80
    );

    ctx.lineTo(
      cx + Math.cos(angle) * radius,
      cy + Math.sin(angle) * radius
    );

    ctx.strokeStyle =
    'rgba(255,255,255,.10)';

    ctx.lineWidth =
    2;

    ctx.stroke();

  }


  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    88,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
  '#24303a';

  ctx.fill();


  ctx.fillStyle =
  '#fff';

  ctx.font =
  'bold 42px -apple-system';

  ctx.textAlign =
  'center';

  ctx.fillText(
    percent + '%',
    cx,
    cy + 8
  );

}


document
.getElementById('targetGift')
.addEventListener(
'change',
event => {

  const percent =
  oddsMap[event.target.value];

  document
  .getElementById('odds')
  .innerText =
  percent + '%';

  drawWheel(
    percent
  );

}
);


async function hideGift(giftId){

  const response =
  await fetch(
    '/api/hide-gift',
    {

      method:'POST',

      headers:{
        'Content-Type':
        'application/json'
      },

      body:
      JSON.stringify({

        initData:
        tg.initData,

        deposit_id:
        Number(giftId)

      })

    }
  );

  const data =
  await response.json();

  if(!response.ok){

    throw new Error(
      data.detail ||
      'Не удалось скрыть подарок'
    );

  }

}


async function spin(){

  const source =
  document
  .getElementById('sourceGift')
  .value;

  if(!source){

    document
    .getElementById('result')
    .innerText =
    'Сначала выбери подарок.';

    return;

  }


  const multiplier =
  document
  .getElementById('targetGift')
  .value;


  const percent =
  oddsMap[multiplier];


  document
  .getElementById('spinBtn')
  .disabled =
  true;


  document
  .getElementById('result')
  .innerText =
  '';


  const win =
  Math.random() * 100 <
  percent;


  let landing;


  if(win){

    landing =
    Math.random() *
    (percent - 2) +
    1;

  }

  else{

    landing =
    percent +
    Math.random() *
    (98 - percent) +
    1;

  }


  const angle =
  360 -
  (
    landing /
    100 *
    360
  );


  rotation +=
  1440 +
  angle;


  document
  .getElementById('wheel')
  .style
  .transform =
  `rotate(${rotation}deg)`;


  setTimeout(
  async () => {

    try{

      if(win){

        document
        .getElementById('result')
        .innerText =
        '✅ Успех';

      }

      else{

        await hideGift(
          source
        );

        document
        .getElementById('result')
        .innerText =
        '❌ Неудача';

        await load();

      }

    }

    catch(error){

      document
      .getElementById('result')
      .innerText =
      'Ошибка: ' +
      error.message;

    }

    finally{

      document
      .getElementById('spinBtn')
      .disabled =
      false;

    }

  },
  3650
  );

}


async function load(){

  const userName =
  document
  .getElementById('userName');


  if(!tg.initData){

    userName.innerText =
    'Открой Mini App из Telegram';

    return;

  }


  try{

    const response =
    await fetch(
      '/api/me',
      {

        method:'POST',

        headers:{
          'Content-Type':
          'application/json'
        },

        body:
        JSON.stringify({

          initData:
          tg.initData

        })

      }
    );


    const data =
    await response.json();


    if(!response.ok){

      throw new Error(
        data.detail ||
        'Ошибка загрузки'
      );

    }


    deposits =
    data.deposits;


    userName.innerText =

    data.user.first_name

    ||

    (
      '@' +
      data.user.username
    )

    ||

    String(
      data.user.id
    );


    document
    .getElementById('depUser')
    .innerText =
    data.deposit_username;


    document
    .getElementById('depLink')
    .href =

    'https://t.me/' +

    data
    .deposit_username
    .replace(
      '@',
      ''
    );


    const gifts =
    deposits.filter(
      gift =>

      gift.status ===
      'approved'

      &&

      !Number(
        gift.hidden
      )
    );


    document
    .getElementById('count')
    .innerText =
    gifts.length;


    document
    .getElementById('sourceGift')
    .innerHTML =

    gifts.length

    ?

    gifts
    .map(
      gift =>
      `
      <option value="${gift.id}">
        Gift #${gift.id}
      </option>
      `
    )
    .join('')

    :

    `
    <option value="">
      Нет доступных подарков
    </option>
    `;


    document
    .getElementById('items')
    .innerHTML =

    gifts.length

    ?

    gifts
    .map(
      gift =>
      `
      <div class="row">

        <div>

          <b>
            Gift #${gift.id}
          </b>

          <div class="muted">
            ${gift.gift_url}
          </div>

        </div>

        <b class="approved">
          ✓
        </b>

      </div>
      `
    )
    .join('')

    :

    'Пока нет подарков.';

  }

  catch(error){

    userName.innerText =
    'Ошибка: ' +
    error.message;

  }

}


async function sendDep(){

  const message =
  document.getElementById('msg');

  const input =
  document.getElementById('giftUrl');


  message.innerText =
  'Отправляем…';


  try{

    const response =
    await fetch(
      '/api/deposit',
      {

        method:'POST',

        headers:{
          'Content-Type':
          'application/json'
        },

        body:
        JSON.stringify({

          initData:
          tg.initData,

          gift_url:
          input.value.trim()

        })

      }
    );


    const data =
    await response.json();


    if(!response.ok){

      throw new Error(
        data.detail ||
        'Ошибка'
      );

    }


    message.innerText =
    'Готово. Ожидает проверки.';


    input.value =
    '';


    await load();

  }

  catch(error){

    message.innerText =
    error.message;

  }

}


drawWheel(
  62
);

load();

</script>

</body>
</html>
